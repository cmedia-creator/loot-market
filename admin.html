<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LOOT MARKET ADMIN</title>
<style>
:root{--bg:#080b10;--panel:#111720;--panel2:#171f2b;--line:#293446;--text:#f4f7fa;--muted:#8f9bad;--accent:#d8ff3e;--danger:#ff6f7d;--warn:#ffd166;--good:#79f2a7}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(1120px,100%);margin:auto;padding:16px}.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.brand{font-size:28px;font-weight:950;letter-spacing:-.04em}.k{font-size:10px;letter-spacing:.16em;color:var(--accent);font-weight:900}.muted{color:var(--muted)}.small{font-size:11px}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:10px;background:#0c1118}.pill.local{color:var(--warn);border-color:#564a2a}.link{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:850;background:var(--panel)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px}.stat b{display:block;font-size:23px}.stat span{font-size:10px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0 10px}.tab{white-space:nowrap;border:1px solid var(--line);background:#0c121a;color:#bcc6d3;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:850}.tab.on{color:var(--accent);border-color:var(--accent)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:900;background:var(--accent);color:#0a0d11}.btn2{border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:850;background:var(--panel2);color:var(--text)}.danger{border-color:#62323a;color:#ff9ba5;background:#291319}.stageSelect{min-width:190px}.tableWrap{border:1px solid var(--line);border-radius:17px;overflow:auto;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:middle}th{font-size:10px;letter-spacing:.06em;color:#9ba8b9;background:#0d131b;position:sticky;top:0}tr:last-child td{border-bottom:0}.thumb{width:48px;height:48px;border:1px solid var(--line);background:#0a0f15;border-radius:10px;display:grid;place-items:center;overflow:hidden;font-size:26px}.thumb img{width:100%;height:100%;object-fit:cover}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 7px;font-size:9px}.rowActions{display:flex;gap:6px}.miniBtn{border:1px solid var(--line);background:#0c121a;color:var(--text);border-radius:9px;padding:6px 8px;font-size:10px}.empty{padding:28px;text-align:center;color:var(--muted)}dialog{width:min(720px,calc(100% - 22px));max-height:92vh;border:1px solid var(--line);border-radius:20px;background:#10161f;color:var(--text);padding:0;box-shadow:0 30px 70px #000a}dialog::backdrop{background:#000a}.dialogHead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#10161f;z-index:2}.dialogHead b{font-size:18px}.close{border:1px solid var(--line);background:#171f2b;color:#fff;border-radius:10px;padding:7px 10px}.form{padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.field label{display:block;font-size:10px;color:#9eaabc;margin-bottom:5px;font-weight:850}.field input,.field select,.field textarea{width:100%;border:1px solid #334158;background:#0a1017;color:#f4f7fa;border-radius:11px;padding:10px;outline:none}.field textarea{min-height:108px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}.help{font-size:10px;color:var(--muted);line-height:1.5;margin-top:5px}.providerBox{border:1px solid var(--line);border-radius:13px;padding:10px;background:#0c1118}.preview{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;background:#0b1118}.previewImg{width:86px;height:86px;flex:0 0 86px;border-radius:12px;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:var(--muted)}.previewImg img{width:100%;height:100%;object-fit:cover}.previewTitle{font-weight:900}.formActions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.notice{border:1px solid #4f482a;background:#18150c;color:#ffe7a5;border-radius:13px;padding:10px 12px;font-size:11px;line-height:1.6;margin:10px 0}.importBox{display:none}.importBox.on{display:block}.toggleLine{display:flex;align-items:center;gap:8px;min-height:42px}.search{margin-left:auto;min-width:220px;border:1px solid var(--line);background:#0b1118;color:#fff;border-radius:11px;padding:9px 10px}.stars{letter-spacing:1px;color:#ffe38c}.provider楽天{color:#ff9c9c}.providerメルカリ{color:#8ac7ff}@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.app{padding:12px}.brand{font-size:24px}.search{margin-left:0;min-width:100%;width:100%}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="k">LOOT MARKET / OPERATIONS</div><div class="brand">管理画面</div><div class="muted small">ステージ・敵・ボス・実在商品を管理する。</div></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill local">● LOCAL MODE / DB未接続</span><a class="link" href="./">ゲームを開く ↗</a></div>
  </div>
  <div class="notice">現在はフロント検証用。保存先はこのブラウザの localStorage のみ。GitHub Pagesは公開でも、他人の管理データを書き換えることはできない。DB接続時にこのデータ構造をそのまま移植する。</div>
  <div class="stats"><div class="stat"><b id="statStages">0</b><span>STAGES</span></div><div class="stat"><b id="statEnemies">0</b><span>ENEMIES</span></div><div class="stat"><b id="statBosses">0</b><span>BOSSES</span></div><div class="stat"><b id="statItems">0</b><span>ITEMS</span></div></div>
  <div class="tabs"><button class="tab on" data-tab="stages">ステージ</button><button class="tab" data-tab="enemies">エネミー</button><button class="tab" data-tab="bosses">ボス</button><button class="tab" data-tab="items">アイテム / アフィ商品</button></div>
  <div class="toolbar">
    <button class="btn" id="addBtn">＋ 追加</button>
    <select id="stageFilter" class="btn2 stageSelect"></select>
    <button class="btn2 importBox" id="csvBtn">CSV取込</button><input id="csvInput" type="file" accept=".csv,text/csv" hidden>
    <button class="btn2" id="exportBtn">JSON書出し</button>
    <button class="btn2 danger" id="resetBtn">ローカル初期化</button>
    <input id="searchInput" class="search" placeholder="検索">
  </div>
  <div id="tableArea" class="tableWrap"></div>
</div>
<dialog id="editDialog"><div class="dialogHead"><b id="dialogTitle">追加</b><button class="close" id="closeDialog">閉じる</button></div><form id="editForm" class="form"></form></dialog>
<script>
const STORE_KEY='loot-market-admin-v1';
const DEFAULT_STATE={stages:[{id:'stage-01',name:'禁断の生活雑貨庫',description:'日用品、便利グッズ、企画会議の正気を疑う品々が眠る。',backgroundUrl:'',active:true}],enemies:[{id:'enemy-001',stageId:'stage-01',name:'収納ミミック',emoji:'📦',imageUrl:'',hp:8,atkMin:1,atkMax:2,active:true},{id:'enemy-002',stageId:'stage-01',name:'暴走モップ',emoji:'🧹',imageUrl:'',hp:9,atkMin:1,atkMax:3,active:true},{id:'enemy-003',stageId:'stage-01',name:'逆襲の目覚まし',emoji:'⏰',imageUrl:'',hp:10,atkMin:1,atkMax:3,active:true},{id:'enemy-004',stageId:'stage-01',name:'無限ティッシュ',emoji:'🧻',imageUrl:'',hp:11,atkMin:2,atkMax:3,active:true},{id:'enemy-005',stageId:'stage-01',name:'家電ゴーレム',emoji:'🧺',imageUrl:'',hp:12,atkMin:2,atkMax:3,active:true}],bosses:[{id:'boss-001',stageId:'stage-01',name:'在庫王 ザ・デッドストック',type:'normal',appearanceRate:100,emoji:'🗿',imageUrl:'',hp:28,atkMin:2,atkMax:4,active:true},{id:'boss-002',stageId:'stage-01',name:'返品不可神 カエセナイ',type:'rare',appearanceRate:5,emoji:'👁️',imageUrl:'',hp:34,atkMin:3,atkMax:5,active:true}],items:[]};
let state=loadState(),currentTab='stages',editingId=null;const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function clone(v){return JSON.parse(JSON.stringify(v))}function loadState(){try{const x=JSON.parse(localStorage.getItem(STORE_KEY));if(x&&x.stages&&x.enemies&&x.bosses&&x.items)return x}catch(e){}return clone(DEFAULT_STATE)}function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));renderAll()}function uid(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}function esc(v=''){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function stageName(id){return state.stages.find(x=>x.id===id)?.name||'未設定'}function star(n){return '★'.repeat(Number(n)||0)+'☆'.repeat(5-(Number(n)||0))}function rarityLabel(n){return ['','COMMON','UNCOMMON','RARE','EPIC','LEGENDARY'][Number(n)]||'COMMON'}
function renderAll(){statStages.textContent=state.stages.length;statEnemies.textContent=state.enemies.length;statBosses.textContent=state.bosses.length;statItems.textContent=state.items.length;renderStageFilter();renderTable()}function renderStageFilter(){const old=stageFilter.value;stageFilter.innerHTML='<option value="all">全ステージ</option>'+state.stages.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');if([...stageFilter.options].some(o=>o.value===old))stageFilter.value=old}function filteredRows(){let rows=state[currentTab]||[];const sf=stageFilter.value,q=searchInput.value.trim().toLowerCase();if(currentTab!=='stages'&&sf&&sf!=='all')rows=rows.filter(x=>x.stageId===sf);if(q)rows=rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q));return rows}
function renderTable(){csvBtn.classList.toggle('on',currentTab==='items');stageFilter.style.display=currentTab==='stages'?'none':'';const rows=filteredRows();if(!rows.length){tableArea.innerHTML='<div class="empty">まだデータがない。</div>';return}if(currentTab==='stages')tableArea.innerHTML=`<table><thead><tr><th>ID</th><th>ステージ名</th><th>説明</th><th>状態</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.id)}</td><td><b>${esc(x.name)}</b></td><td class="muted">${esc(x.description||'')}</td><td>${x.active?'公開':'停止'}</td><td>${actions(x.id)}</td></tr>`).join('')}</tbody></table>`;if(currentTab==='enemies')tableArea.innerHTML=`<table><thead><tr><th>見た目</th><th>エネミー</th><th>ステージ</th><th>HP</th><th>攻撃</th><th>状態</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${thumb(x)}</td><td><b>${esc(x.name)}</b></td><td>${esc(stageName(x.stageId))}</td><td>${x.hp}</td><td>${x.atkMin}〜${x.atkMax}</td><td>${x.active?'有効':'停止'}</td><td>${actions(x.id)}</td></tr>`).join('')}</tbody></table>`;if(currentTab==='bosses')tableArea.innerHTML=`<table><thead><tr><th>見た目</th><th>ボス</th><th>種別</th><th>ステージ</th><th>HP</th><th>攻撃</th><th>出現率</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${thumb(x)}</td><td><b>${esc(x.name)}</b></td><td><span class="badge">${x.type==='rare'?'RARE':'NORMAL'}</span></td><td>${esc(stageName(x.stageId))}</td><td>${x.hp}</td><td>${x.atkMin}〜${x.atkMax}</td><td>${x.appearanceRate}%</td><td>${actions(x.id)}</td></tr>`).join('')}</tbody></table>`;if(currentTab==='items')tableArea.innerHTML=`<table><thead><tr><th>画像</th><th>商品</th><th>ASP</th><th>ステージ</th><th>レア</th><th>意味不明</th><th>実用</th><th>ギフト</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${thumb(x)}</td><td><b>${esc(x.name)}</b><div class="muted small">${esc(x.category||'')} ${x.price?'/ ¥'+Number(x.price).toLocaleString():''}</div></td><td><span class="provider${esc(x.provider)}">${esc(x.provider||'')}</span></td><td>${esc(stageName(x.stageId))}</td><td><span class="badge">${rarityLabel(x.rarity)}</span></td><td class="stars">${star(x.weirdness)}</td><td class="stars">${star(x.usefulness)}</td><td class="stars">${star(x.gift)}</td><td>${actions(x.id)}</td></tr>`).join('')}</tbody></table>`;bindRowActions()}
function thumb(x){return `<div class="thumb">${x.imageUrl?`<img src="${esc(x.imageUrl)}" alt="">`:esc(x.emoji||'📦')}</div>`}function actions(id){return `<div class="rowActions"><button class="miniBtn editBtn" data-id="${esc(id)}">編集</button><button class="miniBtn danger delBtn" data-id="${esc(id)}">削除</button></div>`}function bindRowActions(){$$('.editBtn').forEach(b=>b.onclick=()=>openEditor(b.dataset.id));$$('.delBtn').forEach(b=>b.onclick=()=>deleteRow(b.dataset.id))}function deleteRow(id){const arr=state[currentTab],row=arr.find(x=>x.id===id);if(!row||!confirm(`「${row.name||row.id}」を削除しますか？`))return;state[currentTab]=arr.filter(x=>x.id!==id);save()}
function openEditor(id=null){editingId=id;const row=id?state[currentTab].find(x=>x.id===id):null;dialogTitle.textContent=(id?'編集：':'追加：')+({stages:'ステージ',enemies:'エネミー',bosses:'ボス',items:'アイテム / アフィ商品'}[currentTab]);editForm.innerHTML=formHtml(currentTab,row);wireForm(currentTab,row);editDialog.showModal()}function stageOptions(selected){return state.stages.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}function numField(name,label,value,min=0,max=999){return `<div class="field"><label>${label}</label><input name="${name}" type="number" min="${min}" max="${max}" value="${value??''}" required></div>`}function activeField(v=true){return `<div class="field full"><label>状態</label><div class="toggleLine"><input name="active" type="checkbox" ${v!==false?'checked':''}> 有効</div></div>`}
function formHtml(type,r={}){r=r||{};if(type==='stages')return `<div class="grid"><div class="field"><label>ID</label><input name="id" value="${esc(r.id||uid('stage'))}" ${editingId?'readonly':''}></div><div class="field"><label>ステージ名</label><input name="name" value="${esc(r.name||'')}" required></div><div class="field full"><label>説明</label><textarea name="description">${esc(r.description||'')}</textarea></div><div class="field full"><label>背景画像URL</label><input name="backgroundUrl" value="${esc(r.backgroundUrl||'')}"></div>${activeField(r.active)}</div>${formActions()}`;if(type==='enemies')return `<div class="grid"><div class="field"><label>ステージ</label><select name="stageId">${stageOptions(r.stageId||state.stages[0]?.id)}</select></div><div class="field"><label>エネミー名</label><input name="name" value="${esc(r.name||'')}" required></div><div class="field"><label>絵文字（仮素材）</label><input name="emoji" value="${esc(r.emoji||'👾')}"></div><div class="field"><label>画像URL</label><input name="imageUrl" value="${esc(r.imageUrl||'')}"></div>${numField('hp','HP',r.hp??10,1,999)}${numField('atkMin','攻撃力 MIN',r.atkMin??1,0,99)}${numField('atkMax','攻撃力 MAX',r.atkMax??3,0,99)}${activeField(r.active)}</div>${formActions()}`;if(type==='bosses')return `<div class="grid"><div class="field"><label>ステージ</label><select name="stageId">${stageOptions(r.stageId||state.stages[0]?.id)}</select></div><div class="field"><label>ボス名</label><input name="name" value="${esc(r.name||'')}" required></div><div class="field"><label>種別</label><select name="type"><option value="normal" ${r.type!=='rare'?'selected':''}>通常ボス</option><option value="rare" ${r.type==='rare'?'selected':''}>レアボス</option></select></div><div class="field"><label>出現率 %</label><input name="appearanceRate" type="number" min="0" max="100" value="${r.appearanceRate??5}"></div><div class="field"><label>絵文字（仮素材）</label><input name="emoji" value="${esc(r.emoji||'👹')}"></div><div class="field"><label>画像URL</label><input name="imageUrl" value="${esc(r.imageUrl||'')}"></div>${numField('hp','HP',r.hp??28,1,999)}${numField('atkMin','攻撃力 MIN',r.atkMin??2,0,99)}${numField('atkMax','攻撃力 MAX',r.atkMax??4,0,99)}${activeField(r.active)}</div>${formActions()}`;return productForm(r)}
function productForm(r={}){return `<div class="grid"><div class="field"><label>ステージ</label><select name="stageId">${stageOptions(r.stageId||state.stages[0]?.id)}</select></div><div class="field"><label>商品名</label><input name="name" value="${esc(r.name||'')}" required></div><div class="field"><label>カテゴリ</label><input name="category" value="${esc(r.category||'雑貨・小物')}"></div><div class="field"><label>アフィリエイト</label><select name="provider" id="providerSelect"><option value="楽天" ${r.provider!=='メルカリ'?'selected':''}>楽天</option><option value="メルカリ" ${r.provider==='メルカリ'?'selected':''}>メルカリ</option><option value="その他">その他</option></select></div><div class="field full providerBox" id="rakutenBox"><label>楽天アフィリエイト ソースコード</label><textarea name="sourceCode" id="sourceCode" placeholder="楽天アフィリエイトのHTMLソースをそのまま貼り付け">${esc(r.sourceCode||'')}</textarea><button type="button" class="btn2" id="parseRakuten" style="margin-top:7px">ソースを解析して自動入力</button><div class="help">HTMLは実行しない。リンク・商品画像・価格だけを安全に抽出する。</div></div><div class="field full providerBox" id="mercariBox"><label>メルカリ アフィリエイトURL</label><input name="mercariUrl" value="${esc(r.provider==='メルカリ'?r.affiliateUrl||'':'')}" placeholder="https://..."><div class="help">メルカリはリンクだけでOK。ただし現段階では商品画像をURLから自動取得しないため、画像URLは別途入力。</div></div><div class="field full"><label>保存するアフィリエイトURL</label><input name="affiliateUrl" id="affiliateUrl" value="${esc(r.affiliateUrl||'')}"></div><div class="field full"><label>商品画像URL</label><input name="imageUrl" id="imageUrl" value="${esc(r.imageUrl||'')}"></div>${numField('price','参考価格',r.price??0,0,99999999)}<div class="field"><label>レア度</label><select name="rarity">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(r.rarity||1)===n?'selected':''}>★${n} / ${rarityLabel(n)}</option>`).join('')}</select></div><div class="field"><label>意味不明度</label><select name="weirdness">${starOptions(r.weirdness||1)}</select></div><div class="field"><label>実用力</label><select name="usefulness">${starOptions(r.usefulness||1)}</select></div><div class="field"><label>プレゼント力</label><select name="gift">${starOptions(r.gift||1)}</select></div>${activeField(r.active)}<div class="field full"><label>プレビュー</label><div class="preview"><div class="previewImg" id="previewImg">NO IMAGE</div><div><div class="previewTitle" id="previewTitle">${esc(r.name||'商品名')}</div><div class="muted small" id="previewMeta">${esc(r.provider||'楽天')}</div></div></div></div></div>${formActions()}`}
function starOptions(v){return [1,2,3,4,5].map(n=>`<option value="${n}" ${Number(v)===n?'selected':''}>${'★'.repeat(n)}</option>`).join('')}function formActions(){return `<div class="formActions"><button type="button" class="btn2" id="cancelEdit">キャンセル</button><button class="btn" type="submit">保存</button></div>`}function wireForm(type,row){cancelEdit.onclick=()=>editDialog.close();editForm.onsubmit=e=>{e.preventDefault();saveForm(type,row)};if(type==='items'){providerSelect.onchange=toggleProvider;parseRakuten.onclick=parseRakutenSource;['input','change'].forEach(ev=>editForm.addEventListener(ev,updatePreview));toggleProvider();updatePreview()}}function toggleProvider(){const p=providerSelect.value;rakutenBox.style.display=p==='楽天'?'block':'none';mercariBox.style.display=p==='メルカリ'?'block':'none'}
function parseRakutenHtml(raw){const doc=new DOMParser().parseFromString(raw,'text/html');const links=[...doc.querySelectorAll('a[href]')].map(a=>a.href),affiliateUrl=links.find(x=>x.includes('hb.afl.rakuten.co.jp'))||links[0]||'',imgs=[...doc.querySelectorAll('img[src]')].map(i=>i.src).filter(x=>!x.includes('static.affiliate.rakuten.co.jp/makelink')),imageUrl=imgs[0]||'',texts=[...doc.querySelectorAll('a')].map(a=>a.textContent.trim()).filter(x=>x&&x!=='楽天で購入'),title=texts.sort((a,b)=>b.length-a.length)[0]||'',plain=doc.body.textContent.replace(/\s+/g,' '),m=plain.match(/価格：\s*([0-9,]+)円/);return{affiliateUrl,imageUrl,title,price:m?Number(m[1].replace(/,/g,'')):0}}function parseRakutenSource(){const raw=sourceCode.value.trim();if(!raw)return alert('楽天ソースコードを貼り付けてください。');const p=parseRakutenHtml(raw);affiliateUrl.value=p.affiliateUrl;imageUrl.value=p.imageUrl;if(!editForm.elements.name.value&&p.title)editForm.elements.name.value=p.title;if(p.price)editForm.elements.price.value=p.price;updatePreview();alert('解析完了。URL・画像・価格を抽出しました。')}function updatePreview(){const name=editForm.elements.name?.value||'商品名',provider=editForm.elements.provider?.value||'',img=editForm.elements.imageUrl?.value||'';previewTitle.textContent=name;previewMeta.textContent=provider+(editForm.elements.price?.value?' / ¥'+Number(editForm.elements.price.value).toLocaleString():'');previewImg.innerHTML=img?`<img src="${esc(img)}" alt="">`:'NO IMAGE'}
function val(f,n){return f.elements[n]?.value??''}function nval(f,n){return Number(val(f,n)||0)}function saveForm(type,row){const f=editForm;let data;if(type==='stages')data={id:val(f,'id'),name:val(f,'name').trim(),description:val(f,'description'),backgroundUrl:val(f,'backgroundUrl'),active:f.elements.active.checked};if(type==='enemies')data={id:row?.id||uid('enemy'),stageId:val(f,'stageId'),name:val(f,'name').trim(),emoji:val(f,'emoji'),imageUrl:val(f,'imageUrl'),hp:nval(f,'hp'),atkMin:nval(f,'atkMin'),atkMax:nval(f,'atkMax'),active:f.elements.active.checked};if(type==='bosses')data={id:row?.id||uid('boss'),stageId:val(f,'stageId'),name:val(f,'name').trim(),type:val(f,'type'),appearanceRate:nval(f,'appearanceRate'),emoji:val(f,'emoji'),imageUrl:val(f,'imageUrl'),hp:nval(f,'hp'),atkMin:nval(f,'atkMin'),atkMax:nval(f,'atkMax'),active:f.elements.active.checked};if(type==='items'){let affiliate=val(f,'affiliateUrl').trim();if(val(f,'provider')==='メルカリ'&&val(f,'mercariUrl').trim())affiliate=val(f,'mercariUrl').trim();data={id:row?.id||uid('item'),stageId:val(f,'stageId'),name:val(f,'name').trim(),category:val(f,'category').trim(),provider:val(f,'provider'),sourceCode:val(f,'sourceCode'),affiliateUrl:affiliate,imageUrl:val(f,'imageUrl').trim(),price:nval(f,'price'),rarity:nval(f,'rarity'),weirdness:nval(f,'weirdness'),usefulness:nval(f,'usefulness'),gift:nval(f,'gift'),active:f.elements.active.checked}}if(!data.name)return alert('名前は必須です。');const arr=state[type],i=row?arr.findIndex(x=>x.id===row.id):-1;if(i>=0)arr[i]=data;else arr.unshift(data);editDialog.close();save()}
function parseCsv(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x!==''))rows.push(row);return rows}function countStars(v){const n=(String(v).match(/★/g)||[]).length;return Math.max(1,Math.min(5,n||1))}async function importCsv(file){const text=await file.text(),rows=parseCsv(text);if(rows.length<2)return alert('CSVを読み取れませんでした。');const head=rows[0].map(x=>x.trim()),req=['商品名','カテゴリ','アフィリエイト','ソースコード/URL','レア度','意味不明度','実用力','プレゼント力'];if(!req.every(x=>head.includes(x)))return alert('添付資料と同じ8列のCSVを使用してください。');const idx=Object.fromEntries(head.map((x,i)=>[x,i])),target=stageFilter.value==='all'?(state.stages[0]?.id||''):stageFilter.value;let added=0;for(const r of rows.slice(1)){if(!r[idx['商品名']]?.trim())continue;const provider=r[idx['アフィリエイト']].trim(),src=r[idx['ソースコード/URL']]||'';let parsed={affiliateUrl:src,imageUrl:'',price:0};if(provider==='楽天')parsed=parseRakutenHtml(src);state.items.push({id:uid('item'),stageId:target,name:r[idx['商品名']].trim(),category:r[idx['カテゴリ']].trim(),provider,sourceCode:provider==='楽天'?src:'',affiliateUrl:parsed.affiliateUrl,imageUrl:parsed.imageUrl,price:parsed.price,rarity:countStars(r[idx['レア度']]),weirdness:countStars(r[idx['意味不明度']]),usefulness:countStars(r[idx['実用力']]),gift:countStars(r[idx['プレゼント力']]),active:true});added++}save();alert(`${added}件を取り込みました。楽天ソースはURL・画像・価格まで自動解析済みです。`)}function exportJson(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='loot-market-admin-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');currentTab=b.dataset.tab;searchInput.value='';renderAll()});addBtn.onclick=()=>openEditor();stageFilter.onchange=renderTable;searchInput.oninput=renderTable;csvBtn.onclick=()=>csvInput.click();csvInput.onchange=()=>{if(csvInput.files[0])importCsv(csvInput.files[0]);csvInput.value=''};exportBtn.onclick=exportJson;resetBtn.onclick=()=>{if(confirm('ローカル管理データを初期化しますか？')){state=clone(DEFAULT_STATE);save()}};closeDialog.onclick=()=>editDialog.close();renderAll();
</script>
