<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>LOOT MARKET ADMIN</title>
<style>
:root{--bg:#080b10;--panel:#111720;--panel2:#171f2b;--line:#293446;--text:#f4f7fa;--muted:#8f9bad;--accent:#d8ff3e;--danger:#ff6f7d;--warn:#ffd166;--good:#79f2a7}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(1120px,100%);margin:auto;padding:16px}.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.brand{font-size:28px;font-weight:950;letter-spacing:-.04em}.k{font-size:10px;letter-spacing:.16em;color:var(--accent);font-weight:900}.muted{color:var(--muted)}.small{font-size:11px}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:10px;background:#0c1118}.pill.ok{color:var(--good);border-color:#31543d}.pill.ng{color:var(--danger);border-color:#65343b}.link{color:var(--text);text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:850;background:var(--panel)}.auth{margin:14px 0;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px}.authRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.auth input{flex:1;min-width:220px;border:1px solid #334158;background:#0a1017;color:#fff;border-radius:11px;padding:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:12px}.stat b{display:block;font-size:23px}.stat span{font-size:10px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0 10px}.tab{white-space:nowrap;border:1px solid var(--line);background:#0c121a;color:#bcc6d3;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:850}.tab.on{color:var(--accent);border-color:var(--accent)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:900;background:var(--accent);color:#0a0d11}.btn2{border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:850;background:var(--panel2);color:var(--text)}.danger{border-color:#62323a;color:#ff9ba5;background:#291319}.search{margin-left:auto;min-width:220px;border:1px solid var(--line);background:#0b1118;color:#fff;border-radius:11px;padding:9px 10px}.tableWrap{border:1px solid var(--line);border-radius:17px;overflow:auto;background:var(--panel)}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:middle}th{font-size:10px;letter-spacing:.06em;color:#9ba8b9;background:#0d131b;position:sticky;top:0}tr:last-child td{border-bottom:0}.thumb{width:52px;height:52px;border:1px solid var(--line);background:#0a0f15;border-radius:10px;display:grid;place-items:center;overflow:hidden;font-size:26px;color:var(--muted)}.thumb img{width:100%;height:100%;object-fit:cover}.rowActions{display:flex;gap:6px}.miniBtn{border:1px solid var(--line);background:#0c121a;color:var(--text);border-radius:9px;padding:6px 8px;font-size:10px}.empty{padding:28px;text-align:center;color:var(--muted)}dialog{width:min(720px,calc(100% - 22px));max-height:92vh;border:1px solid var(--line);border-radius:20px;background:#10161f;color:var(--text);padding:0;box-shadow:0 30px 70px #000a}dialog::backdrop{background:#000a}.dialogHead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#10161f;z-index:2}.dialogHead b{font-size:18px}.close{border:1px solid var(--line);background:#171f2b;color:#fff;border-radius:10px;padding:7px 10px}.form{padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.field label{display:block;font-size:10px;color:#9eaabc;margin-bottom:5px;font-weight:850}.field input,.field select,.field textarea{width:100%;border:1px solid #334158;background:#0a1017;color:#f4f7fa;border-radius:11px;padding:10px;outline:none}.field textarea{min-height:108px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}.help{font-size:10px;color:var(--muted);line-height:1.5;margin-top:5px}.preview{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;background:#0b1118}.previewImg{width:92px;height:92px;flex:0 0 92px;border-radius:12px;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:var(--muted)}.previewImg img{width:100%;height:100%;object-fit:cover}.previewTitle{font-weight:900}.formActions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.notice{border:1px solid #334158;background:#0d131b;border-radius:13px;padding:10px 12px;font-size:11px;line-height:1.6;margin:10px 0}.notice.warn{border-color:#4f482a;background:#18150c;color:#ffe7a5}.stars{letter-spacing:1px;color:#ffe38c}.provider-rakuten{color:#ff9c9c}.provider-mercari{color:#8ac7ff}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#101820;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.18s;z-index:10;max-width:calc(100% - 24px)}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}.toast.err{border-color:#693640;color:#ffb0b7}.progress{height:8px;background:#222d3a;border-radius:999px;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:var(--accent);width:0}.hide{display:none!important}
.rulesIntro{border:1px solid #3b4729;background:#11170c;border-radius:14px;padding:11px 13px;margin-bottom:10px;font-size:11px;line-height:1.6}.rulesIntro b{color:var(--accent)}.rulesGrid{display:grid;gap:10px}.ruleCard{border:1px solid var(--line);border-radius:17px;background:var(--panel);overflow:hidden}.ruleHead{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 13px;border-bottom:1px solid var(--line)}.ruleHead b{font-size:14px}.ruleHead span{font-size:9px;color:var(--muted)}.ruleCount{border:1px solid #3a4658;border-radius:999px;padding:5px 8px;font-size:9px;color:#c7d0dc}.ruleBody{padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.ruleGroup{border:1px solid #293446;border-radius:12px;padding:10px;background:#0c1219}.ruleGroupTitle{font-size:10px;font-weight:900;margin-bottom:7px}.ruleGroupTitle small{display:block;color:var(--muted);font-size:8px;font-weight:500;margin-top:2px}.ruleOptions{display:grid;gap:5px}.ruleOption{display:flex;align-items:center;gap:7px;border:1px solid #263141;border-radius:9px;padding:7px 8px;background:#101720;font-size:10px}.ruleOption input{accent-color:#ff7b88}.ruleOption:has(input:checked){border-color:#6a3940;background:#211218;color:#ffc1c7}.ruleActions{display:flex;justify-content:flex-end;gap:7px;padding:0 12px 12px}.ruleSave{background:var(--accent);color:#091008;border:0;border-radius:10px;padding:8px 11px;font-weight:900;font-size:10px}.ruleReset{border:1px solid var(--line);background:#141c26;color:#d2dae5;border-radius:10px;padding:8px 11px;font-weight:800;font-size:10px}
@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.app{padding:12px}.brand{font-size:24px}.search{margin-left:0;min-width:100%;width:100%}.auth input{min-width:100%}.ruleBody{grid-template-columns:1fr}.ruleHead{align-items:flex-start}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="k">LOOT MARKET / OPERATIONS</div><div class="brand">管理画面</div><div class="muted small">Cloudflare D1 + R2 本番接続</div></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill" id="conn">● 接続確認中</span><a class="link" href="./">ゲームを開く ↗</a></div></div>
  <div class="auth"><div class="k">ADMIN AUTH</div><div class="authRow" style="margin-top:7px"><input id="tokenInput" type="password" autocomplete="off" placeholder="Cloudflare ADMIN_TOKEN"><button class="btn" id="saveToken">このタブで認証</button><button class="btn2" id="clearToken">解除</button></div><div class="help">トークンは sessionStorage のみ。タブを閉じると消える。GitHubやDBには保存しない。</div></div>
  <div class="stats"><div class="stat"><b id="statStages">-</b><span>STAGES</span></div><div class="stat"><b id="statEnemies">-</b><span>ENEMIES</span></div><div class="stat"><b id="statBosses">-</b><span>BOSSES</span></div><div class="stat"><b id="statItems">-</b><span>ITEMS</span></div></div>
  <div class="tabs"><button class="tab on" data-tab="stages">ステージ</button><button class="tab" data-tab="enemies">エネミー</button><button class="tab" data-tab="bosses">ボス</button><button class="tab" data-tab="items">アイテム / アフィ商品</button><button class="tab" data-tab="rules">🎚 ダンジョン制限</button></div>
  <div class="toolbar"><button class="btn" id="addBtn">＋ 追加</button><button class="btn2" id="refreshBtn">↻ 再読込</button><button class="btn2 hide" id="csvBtn">CSV取込</button><input class="search" id="search" placeholder="名前で検索"></div><div class="tableWrap"><div id="table"></div></div>
</div>
<dialog id="editDialog"><div class="dialogHead"><b id="dialogTitle">追加</b><button class="close" data-close="editDialog">閉じる</button></div><form class="form" id="editForm"><div id="formFields" class="grid"></div><div class="formActions"><button type="button" class="btn2" data-close="editDialog">キャンセル</button><button type="submit" class="btn" id="saveBtn">保存</button></div></form></dialog>
<dialog id="csvDialog"><div class="dialogHead"><b>商品CSVをD1へ取り込む</b><button class="close" data-close="csvDialog">閉じる</button></div><div class="form"><div class="grid"><div class="field"><label>登録先ステージ</label><select id="csvStage"></select></div><div class="field"><label>CSVファイル</label><input id="csvFile" type="file" accept=".csv,text/csv"></div><div class="full notice warn">対応列：商品名 / カテゴリ / アフィリエイト / ソースコード/URL / レア度 / 意味不明度 / 実用力 / プレゼント力。楽天ソースはリンク・画像・価格を自動解析する。</div><div class="full" id="csvStatus"></div></div><div class="formActions"><button class="btn2" data-close="csvDialog">キャンセル</button><button class="btn" id="importBtn">D1へ取り込む</button></div></div></dialog>
<div class="toast" id="toast"></div>
<script>
const API='https://loot-market.c-media-satoru.workers.dev';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={tab:'stages',data:{stages:[],enemies:[],bosses:[],items:[],rules:[]},token:sessionStorage.getItem('loot_admin_token')||'',editing:null};
const labels={stages:'ステージ',enemies:'エネミー',bosses:'ボス',items:'アイテム'};
const folders={stages:'stages',enemies:'enemies',bosses:'bosses'};
const rarityNames=['','COMMON','UNCOMMON','RARE','EPIC','LEGENDARY'];let toastTimer;
const RULE_GROUPS=[
  {field:'disabled_turn_dice',title:'特殊ダイス',sub:'毎ターン抽選から除外',items:[['explosion','💥 爆発ダイス'],['lucky','🍀 ラッキーダイス'],['drain','🩸 ドレインダイス'],['minus','➖ マイナスダイス'],['negative','☁️ ネガティブダイス'],['revenge','🕷️ 復讐のダイス']]},
  {field:'disabled_special_dice',title:'保持スペシャルダイス',sub:'ドロップ・使用を禁止',items:[['revive','🪽 復活のダイス'],['gamble','🎯 ギャンブルダイス'],['triple','🎰 ゾロ目ダイス'],['death','☠️ デスダイス']]},
  {field:'disabled_combo_skills',title:'コンボスキル',sub:'条件を満たしても発動しない',items:[['rescue','✦ 神の救済'],['beloved','♛ 神に愛されし者'],['blessing','✧ 女神の祝福'],['theory','⚔ 強者の理論'],['first','⚡ 先手必勝']]}
];
function toast(msg,err=false){const el=$('#toast');el.textContent=msg;el.className='toast on'+(err?' err':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='toast',2600)}
function authHeaders(json=true){const h={};if(json)h['Content-Type']='application/json';if(state.token)h.Authorization=`Bearer ${state.token}`;return h}
async function api(path,opt={}){const res=await fetch(API+path,{...opt,headers:{...authHeaders(!(opt.body instanceof FormData)),...(opt.headers||{})}});let body;try{body=await res.json()}catch{body={ok:false,error:`HTTP ${res.status}`}}if(!res.ok||body.ok===false)throw new Error(body.error||`HTTP ${res.status}`);return body}
function mediaUrl(key){return key?API+'/api/media/'+key.split('/').map(encodeURIComponent).join('/'):''}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]))}
function star(n){return '★'.repeat(Number(n)||0)+'☆'.repeat(Math.max(0,5-(Number(n)||0)))}
function stageName(id){return state.data.stages.find(x=>x.id===id)?.name||id||'-'}
function providerLabel(p){return p==='rakuten'?'楽天':p==='mercari'?'メルカリ':'OTHER'}
function imgCell(row,item=false){const src=row.image_key?mediaUrl(row.image_key):(item?row.image_url:'');return `<div class="thumb">${src?`<img src="${esc(src)}" alt="">`:'NO IMG'}</div>`}
function ruleFor(stageId){return state.data.rules.find(x=>x.stage_id===stageId)||{stage_id:stageId,disabled_turn_dice:[],disabled_special_dice:[],disabled_combo_skills:[]}}
function ruleCount(stageId){const r=ruleFor(stageId);return RULE_GROUPS.reduce((n,g)=>n+(Array.isArray(r[g.field])?r[g.field].length:0),0)}
async function checkHealth(){try{const h=await api('/api/health');const ok=h.bindings?.DB&&h.bindings?.MEDIA;$('#conn').textContent=ok?(h.adminWrites?'● DB / R2 / ADMIN READY':'● DB / R2 OK・書込OFF'):'● Binding NG';$('#conn').className='pill '+(ok?'ok':'ng')}catch(e){$('#conn').textContent='● API接続失敗';$('#conn').className='pill ng'}}
async function loadAll(){try{const names=['stages','enemies','bosses','items'];const rows=await Promise.all(names.map(async n=>{const r=await api('/api/'+n);return[n,r.data||[]]}));for(const [n,d] of rows)state.data[n]=d;if(state.token){try{state.data.rules=(await api('/api/stage-rules')).data||[]}catch(e){state.data.rules=[];if(state.tab==='rules')toast('制限設定の読込失敗: '+e.message,true)}}else state.data.rules=[];updateStats();render();populateCsvStage();await checkHealth()}catch(e){toast('読込失敗: '+e.message,true)}}
function updateStats(){for(const n of ['Stages','Enemies','Bosses','Items'])$('#stat'+n).textContent=state.data[n.toLowerCase()].length}
function filtered(){const q=$('#search').value.trim().toLowerCase();return (state.data[state.tab]||[]).filter(x=>!q||String(x.name||'').toLowerCase().includes(q))}
function render(){if(state.tab==='rules'){renderRules();return}const rows=filtered();if(!rows.length){$('#table').innerHTML='<div class="empty">データなし</div>';return}let head='',body='';if(state.tab==='stages'){head='<th>画像</th><th>ステージ</th><th>slug</th><th>表示順</th><th>制限</th><th>状態</th><th></th>';body=rows.map(r=>`<tr><td>${imgCell(r)}</td><td><b>${esc(r.name)}</b><div class="muted small">${esc(r.description)}</div></td><td>${esc(r.slug)}</td><td>${r.sort_order}</td><td>${ruleCount(r.id)?`<span class="pill ng">${ruleCount(r.id)} 無効</span>`:'<span class="pill ok">制限なし</span>'}</td><td>${r.is_active?'公開':'停止'}</td><td>${actions(r.id)}</td></tr>`).join('')}if(state.tab==='enemies'){head='<th>画像</th><th>エネミー</th><th>ステージ</th><th>HP</th><th>攻撃</th><th>重み</th><th></th>';body=rows.map(r=>`<tr><td>${imgCell(r)}</td><td><b>${esc(r.name)}</b></td><td>${esc(stageName(r.stage_id))}</td><td>${r.hp}</td><td>${r.attack_min}〜${r.attack_max}</td><td>${r.spawn_weight}</td><td>${actions(r.id)}</td></tr>`).join('')}if(state.tab==='bosses'){head='<th>画像</th><th>ボス</th><th>ステージ</th><th>HP</th><th>攻撃</th><th>出現率</th><th></th>';body=rows.map(r=>`<tr><td>${imgCell(r)}</td><td><b>${esc(r.name)}</b><div class="small ${r.is_rare?'stars':''}">${r.is_rare?'RARE BOSS':'BOSS'}</div></td><td>${esc(stageName(r.stage_id))}</td><td>${r.hp}</td><td>${r.attack_min}〜${r.attack_max}</td><td>${Math.round(Number(r.encounter_rate)*100)}%</td><td>${actions(r.id)}</td></tr>`).join('')}if(state.tab==='items'){head='<th>画像</th><th>商品</th><th>ステージ</th><th>ASP</th><th>レア</th><th>価格</th><th></th>';body=rows.map(r=>`<tr><td>${imgCell(r,true)}</td><td><b>${esc(r.name)}</b><div class="muted small">${esc(r.category||'')}</div></td><td>${esc(stageName(r.stage_id))}</td><td class="provider-${esc(r.provider)}">${providerLabel(r.provider)}</td><td>${rarityNames[r.rarity]||r.rarity}<div class="stars">${star(r.rarity)}</div></td><td>${r.price_yen==null?'-':'¥'+Number(r.price_yen).toLocaleString()}</td><td>${actions(r.id)}</td></tr>`).join('')}$('#table').innerHTML=`<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;bindRows()}
function renderRules(){if(!state.token){$('#table').innerHTML='<div class="empty">ADMIN_TOKENで認証するとダンジョン制限を編集できます。</div>';return}if(!state.data.rules.length){$('#table').innerHTML='<div class="empty">制限設定を読み込めません。D1 migration 0004 の適用を確認してください。</div>';return}const cards=state.data.rules.map(r=>{const count=RULE_GROUPS.reduce((n,g)=>n+(r[g.field]?.length||0),0);const groups=RULE_GROUPS.map(g=>`<div class="ruleGroup"><div class="ruleGroupTitle">${g.title}<small>${g.sub}</small></div><div class="ruleOptions">${g.items.map(([key,label])=>`<label class="ruleOption"><input type="checkbox" data-rule-field="${g.field}" value="${key}" ${r[g.field]?.includes(key)?'checked':''}> <span>${label}</span></label>`).join('')}</div></div>`).join('');return `<section class="ruleCard" data-stage-rule="${esc(r.stage_id)}"><div class="ruleHead"><div><b>${esc(r.name)}</b><span>${esc(r.slug)}${Number(r.is_active)?'':' / 停止中'}</span></div><div class="ruleCount">${count?count+'項目を無効':'すべて有効'}</div></div><div class="ruleBody">${groups}</div><div class="ruleActions"><button class="ruleReset" type="button" data-rule-reset>すべて有効に戻す</button><button class="ruleSave" type="button" data-rule-save>この設定を保存</button></div></section>`}).join('');$('#table').innerHTML=`<div class="rulesIntro"><b>チェックした項目は、そのダンジョンでは出現・発動しません。</b><br>無効にした特殊ダイスの確率はノーマルダイスに置き換わります。保持ダイスはドロップせず、コンボスキルは条件を満たしても発動しません。</div><div class="rulesGrid">${cards}</div>`;$$('[data-rule-save]').forEach(b=>b.onclick=()=>saveRules(b.closest('[data-stage-rule]')));$$('[data-rule-reset]').forEach(b=>b.onclick=()=>{const card=b.closest('[data-stage-rule]');card.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=false);saveRules(card)})}
async function saveRules(card){if(!state.token)return toast('先にADMIN_TOKENで認証して',true);const stageId=card.dataset.stageRule,body={disabled_turn_dice:[],disabled_special_dice:[],disabled_combo_skills:[]};card.querySelectorAll('[data-rule-field]:checked').forEach(x=>body[x.dataset.ruleField].push(x.value));const save=card.querySelector('[data-rule-save]');if(save)save.disabled=true;try{await api('/api/stage-rules/'+encodeURIComponent(stageId),{method:'PUT',body:JSON.stringify(body)});toast('ダンジョン制限を保存した');await loadAll()}catch(e){toast('制限設定の保存失敗: '+e.message,true)}finally{if(save)save.disabled=false}}
function actions(id){return `<div class="rowActions"><button class="miniBtn edit" data-id="${esc(id)}">編集</button><button class="miniBtn danger del" data-id="${esc(id)}">削除</button></div>`}
function bindRows(){$$('.edit').forEach(b=>b.onclick=()=>openEdit(b.dataset.id));$$('.del').forEach(b=>b.onclick=()=>removeRow(b.dataset.id))}
function stageOptions(selected=''){return state.data.stages.map(s=>`<option value="${esc(s.id)}" ${s.id===selected?'selected':''}>${esc(s.name)}</option>`).join('')}
function field(name,label,value='',type='text',extra=''){const full=extra.includes('full');return `<div class="field ${full?'full':''}"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value??'')}" ${extra.replace('full','')}></div>`}
function selectField(name,label,options,value='',full=false){return `<div class="field ${full?'full':''}"><label>${label}</label><select name="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`}
function textarea(name,label,value='',full=true){return `<div class="field ${full?'full':''}"><label>${label}</label><textarea name="${name}">${esc(value??'')}</textarea></div>`}
function activeField(v=1){return selectField('is_active','状態',[[1,'公開'],[0,'停止']],v)}
function imageField(row){const src=row?.image_key?mediaUrl(row.image_key):'';return `<div class="field full"><label>画像アップロード</label><div class="preview"><div class="previewImg" id="imgPreview">${src?`<img src="${esc(src)}" alt="">`:'未登録'}</div><div><div class="previewTitle">アップロード前に自動圧縮</div><div class="help">長辺1200px以下 / WebP quality 0.78。元画像はR2へ送らない。</div><input name="image_file" type="file" accept="image/*" style="margin-top:8px"></div></div></div>`}
function openEdit(id=null){if(state.tab==='rules')return;state.editing=id?state.data[state.tab].find(x=>x.id===id):null;const r=state.editing||{};$('#dialogTitle').textContent=(id?'編集: ':'追加: ')+labels[state.tab];let h='';if(state.tab==='stages'){h=field('name','ステージ名',r.name)+field('slug','slug',r.slug||'')+textarea('description','説明',r.description||'')+field('sort_order','表示順',r.sort_order??state.data.stages.length+1,'number')+activeField(r.is_active??1)+imageField(r)}if(state.tab==='enemies'){h=selectField('stage_id','ステージ',state.data.stages.map(s=>[s.id,s.name]),r.stage_id||state.data.stages[0]?.id)+field('name','エネミー名',r.name)+field('hp','HP',r.hp??10,'number','min="1"')+field('attack_min','攻撃 MIN',r.attack_min??1,'number','min="0"')+field('attack_max','攻撃 MAX',r.attack_max??3,'number','min="0"')+field('spawn_weight','出現重み',r.spawn_weight??1,'number','min="1"')+field('sort_order','表示順',r.sort_order??1,'number')+activeField(r.is_active??1)+imageField(r)}if(state.tab==='bosses'){h=selectField('stage_id','ステージ',state.data.stages.map(s=>[s.id,s.name]),r.stage_id||state.data.stages[0]?.id)+field('name','ボス名',r.name)+field('hp','HP',r.hp??30,'number','min="1"')+field('attack_min','攻撃 MIN',r.attack_min??2,'number','min="0"')+field('attack_max','攻撃 MAX',r.attack_max??4,'number','min="0"')+selectField('is_rare','種別',[[0,'通常ボス'],[1,'レアボス']],r.is_rare??0)+field('encounter_pct','出現率 %',r.encounter_rate==null?5:Math.round(Number(r.encounter_rate)*100),'number','min="0" max="100" step="0.1"')+selectField('min_loot_rarity','最低ドロップ',[[1,'COMMON+'],[2,'UNCOMMON+'],[3,'RARE+'],[4,'EPIC+'],[5,'LEGENDARY']],r.min_loot_rarity??3)+field('sort_order','表示順',r.sort_order??1,'number')+activeField(r.is_active??1)+imageField(r)}if(state.tab==='items'){h=selectField('stage_id','ステージ',state.data.stages.map(s=>[s.id,s.name]),r.stage_id||state.data.stages[0]?.id)+field('name','商品名',r.name)+field('category','カテゴリ',r.category||'')+selectField('provider','アフィリエイト',[['rakuten','楽天'],['mercari','メルカリ'],['other','その他']],r.provider||'rakuten')+field('affiliate_url','アフィリエイトURL',r.affiliate_url||'','url','full')+textarea('affiliate_source_html','楽天ソースコード',r.affiliate_source_html||'')+`<div class="field full"><button type="button" class="btn2" id="parseRakuten">楽天ソースを解析</button><div class="help">ソースは画面へHTMLとして挿入せず、DOMParserでURL・画像・価格だけ解析する。</div></div>`+field('image_url','商品画像URL',r.image_url||'','url','full')+field('price_yen','参考価格',r.price_yen??'','number','min="0"')+selectField('rarity','レア度',[[1,'★ COMMON'],[2,'★★ UNCOMMON'],[3,'★★★ RARE'],[4,'★★★★ EPIC'],[5,'★★★★★ LEGENDARY']],r.rarity??1)+selectField('weirdness','意味不明度',[[1,'★'],[2,'★★'],[3,'★★★'],[4,'★★★★'],[5,'★★★★★']],r.weirdness??1)+selectField('usefulness','実用力',[[1,'★'],[2,'★★'],[3,'★★★'],[4,'★★★★'],[5,'★★★★★']],r.usefulness??1)+selectField('gift_power','プレゼント力',[[1,'★'],[2,'★★'],[3,'★★★'],[4,'★★★★'],[5,'★★★★★']],r.gift_power??1)+textarea('description','説明',r.description||'')+activeField(r.is_active??1)}$('#formFields').innerHTML=h;$('#editDialog').showModal();const file=$('[name=image_file]');if(file)file.onchange=()=>previewSelected(file.files[0]);const p=$('#parseRakuten');if(p)p.onclick=()=>{const src=$('[name=affiliate_source_html]').value;const d=parseRakuten(src);if(d.affiliate_url)$('[name=affiliate_url]').value=d.affiliate_url;if(d.image_url)$('[name=image_url]').value=d.image_url;if(d.price_yen)$('[name=price_yen]').value=d.price_yen;toast('楽天ソースを解析した')}}
async function previewSelected(file){if(!file)return;try{const blob=await compressImage(file);$('#imgPreview').innerHTML=`<img src="${URL.createObjectURL(blob)}" alt="">`;toast(`${Math.round(file.size/1024)}KB → ${Math.round(blob.size/1024)}KB`)}catch(e){toast('画像処理失敗: '+e.message,true)}}
function loadImage(file){return new Promise((resolve,reject)=>{const u=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(u);resolve(img)};img.onerror=()=>{URL.revokeObjectURL(u);reject(new Error('画像を読めません'))};img.src=u})}
async function compressImage(file){const img=await loadImage(file);const max=1200,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{alpha:false});x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(img,0,0,w,h);let blob=await new Promise(r=>c.toBlob(r,'image/webp',.78));if(!blob)blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));if(!blob)throw new Error('圧縮に失敗');return new File([blob],file.name.replace(/\.[^.]+$/,blob.type==='image/webp'?'.webp':'.jpg'),{type:blob.type})}
async function uploadImage(file,folder){const compressed=await compressImage(file),fd=new FormData();fd.append('folder',folder);fd.append('file',compressed);return api('/api/media',{method:'POST',body:fd})}
function formObject(form){const o=Object.fromEntries(new FormData(form).entries());delete o.image_file;return o}
$('#editForm').onsubmit=async e=>{e.preventDefault();if(!state.token)return toast('先にADMIN_TOKENで認証して',true);const btn=$('#saveBtn');btn.disabled=true;const old=state.editing;let uploaded=null;try{const body=formObject(e.currentTarget);if(state.tab==='bosses'){body.encounter_rate=Number(body.encounter_pct)/100;delete body.encounter_pct}if(state.tab==='items'&&body.price_yen==='')body.price_yen=null;for(const k of ['sort_order','is_active','hp','attack_min','attack_max','spawn_weight','is_rare','min_loot_rarity','rarity','weirdness','usefulness','gift_power','price_yen'])if(body[k]!==undefined&&body[k]!==null&&body[k]!=='')body[k]=Number(body[k]);if(body.encounter_rate!==undefined)body.encounter_rate=Number(body.encounter_rate);const file=$('[name=image_file]')?.files?.[0];if(file&&folders[state.tab]){uploaded=await uploadImage(file,folders[state.tab]);body.image_key=uploaded.key}await api('/api/'+state.tab+(old?'/'+encodeURIComponent(old.id):''),{method:old?'PATCH':'POST',body:JSON.stringify(body)});if(uploaded&&old?.image_key&&old.image_key!==uploaded.key)api('/api/media/'+old.image_key.split('/').map(encodeURIComponent).join('/'),{method:'DELETE'}).catch(()=>{});$('#editDialog').close();toast('保存した');await loadAll()}catch(err){if(uploaded)api('/api/media/'+uploaded.key.split('/').map(encodeURIComponent).join('/'),{method:'DELETE'}).catch(()=>{});toast('保存失敗: '+err.message,true)}finally{btn.disabled=false}}
async function removeRow(id){if(!state.token)return toast('先にADMIN_TOKENで認証して',true);const row=state.data[state.tab].find(x=>x.id===id),extra=state.tab==='stages'?'\nこのステージ配下の敵・ボス・商品・条件もDBから削除されます。':'';if(!confirm(`「${row?.name||id}」を削除しますか？${extra}`))return;try{await api('/api/'+state.tab+'/'+encodeURIComponent(id),{method:'DELETE'});const keys=[];if(row?.image_key)keys.push(row.image_key);if(state.tab==='stages'){state.data.enemies.filter(x=>x.stage_id===id&&x.image_key).forEach(x=>keys.push(x.image_key));state.data.bosses.filter(x=>x.stage_id===id&&x.image_key).forEach(x=>keys.push(x.image_key))}for(const key of keys)api('/api/media/'+key.split('/').map(encodeURIComponent).join('/'),{method:'DELETE'}).catch(()=>{});toast('削除した');await loadAll()}catch(e){toast('削除失敗: '+e.message,true)}}
function parseRakuten(src){const out={affiliate_url:'',image_url:'',price_yen:null};if(!src)return out;const doc=new DOMParser().parseFromString(src,'text/html'),a=[...doc.querySelectorAll('a[href]')].find(x=>x.getAttribute('href')?.includes('hb.afl.rakuten.co.jp'))||doc.querySelector('a[href]');if(a)out.affiliate_url=a.getAttribute('href')||'';const imgs=[...doc.querySelectorAll('img[src]')],img=imgs.find(x=>x.getAttribute('src')?.includes('hbb.afl.rakuten.co.jp'))||imgs[0];if(img){let u=img.getAttribute('src')||'';try{const pc=new URL(u).searchParams.get('pc');if(pc)u=pc}catch{}out.image_url=u}const m=(doc.body.textContent||src).match(/([0-9][0-9,]*)\s*円/);if(m)out.price_yen=Number(m[1].replace(/,/g,''));return out}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(q){if(c==='"'&&n==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else{if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(c!=='\r')cell+=c}}if(cell||row.length){row.push(cell);rows.push(row)}const head=rows.shift()?.map(x=>x.trim())||[];return rows.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]??''])))}
function countStars(v){const s=String(v||''),c=(s.match(/★/g)||[]).length;if(c)return c;const n=Number(s);return Number.isFinite(n)?Math.max(1,Math.min(5,n)):1}
function populateCsvStage(){$('#csvStage').innerHTML=stageOptions()}
$('#csvBtn').onclick=()=>{populateCsvStage();$('#csvStatus').innerHTML='';$('#csvDialog').showModal()}
$('#importBtn').onclick=async()=>{if(!state.token)return toast('先にADMIN_TOKENで認証して',true);const file=$('#csvFile').files[0],stage=$('#csvStage').value;if(!file||!stage)return toast('ステージとCSVを選んで',true);const btn=$('#importBtn');btn.disabled=true;try{const rows=parseCSV((await file.text()).replace(/^\uFEFF/,''));if(!rows.length)throw new Error('CSVにデータがない');let ok=0,fail=0;$('#csvStatus').innerHTML=`<div class="small">0 / ${rows.length}</div><div class="progress"><div id="csvBar"></div></div>`;for(let i=0;i<rows.length;i++){const r=rows[i],jp=String(r['アフィリエイト']||'').trim(),provider=jp.includes('楽天')?'rakuten':jp.includes('メルカリ')?'mercari':'other',source=String(r['ソースコード/URL']||'').trim(),d=provider==='rakuten'?parseRakuten(source):{affiliate_url:source,image_url:'',price_yen:null},body={stage_id:stage,name:String(r['商品名']||'').trim(),category:String(r['カテゴリ']||'').trim(),provider,affiliate_url:d.affiliate_url,affiliate_source_html:provider==='rakuten'?source:'',image_url:d.image_url,price_yen:d.price_yen,rarity:countStars(r['レア度']),weirdness:countStars(r['意味不明度']),usefulness:countStars(r['実用力']),gift_power:countStars(r['プレゼント力']),description:'',is_active:1};try{await api('/api/items',{method:'POST',body:JSON.stringify(body)});ok++}catch{fail++}$('#csvStatus .small').textContent=`${i+1} / ${rows.length}　成功 ${ok}　失敗 ${fail}`;$('#csvBar').style.width=`${(i+1)/rows.length*100}%`}toast(`CSV完了: 成功 ${ok} / 失敗 ${fail}`,fail>0);await loadAll()}catch(e){toast('CSV取込失敗: '+e.message,true)}finally{btn.disabled=false}}
$('#addBtn').onclick=()=>openEdit();$('#refreshBtn').onclick=loadAll;$('#search').oninput=render;$$('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;$$('.tab').forEach(x=>x.classList.toggle('on',x===b));const rules=state.tab==='rules';$('#addBtn').classList.toggle('hide',rules);$('#csvBtn').classList.toggle('hide',state.tab!=='items');$('#search').classList.toggle('hide',rules);$('#search').value='';render()});$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).close());
$('#tokenInput').value=state.token;$('#saveToken').onclick=async()=>{const v=$('#tokenInput').value.trim();if(!v)return toast('ADMIN_TOKENを入力して',true);state.token=v;sessionStorage.setItem('loot_admin_token',v);toast('トークンをこのタブにセットした');await loadAll()};$('#clearToken').onclick=()=>{state.token='';state.data.rules=[];sessionStorage.removeItem('loot_admin_token');$('#tokenInput').value='';toast('認証を解除した');loadAll()};loadAll();
</script>
