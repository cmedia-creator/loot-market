<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>LOOT MARKET</title>
<style>
:root{--bg:#080b10;--panel:#111720;--panel2:#171f2b;--line:#293446;--text:#f4f7fa;--muted:#8f9bad;--accent:#d8ff3e;--good:#79f2a7;--bad:#ff6f7d;--warn:#ffd166}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,a{font:inherit}button{touch-action:manipulation}body{min-height:100vh}.app{width:min(760px,100%);margin:auto;padding:12px 12px 54px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.brand{font-size:27px;font-weight:950;letter-spacing:-.05em;line-height:1}.k{font-size:9px;letter-spacing:.16em;color:var(--accent);font-weight:900}.sub{font-size:11px;color:var(--muted);line-height:1.5}.badge{border:1px solid var(--line);border-radius:999px;padding:7px 9px;font-size:10px;white-space:nowrap}.screen{display:none}.screen.on{display:block}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.card{border:1px solid #39475e;border-radius:16px;background:linear-gradient(145deg,#17202c,#0e141d);padding:16px}.title{font-size:22px;font-weight:950;margin:4px 0}.btn,.btn2,.action{cursor:pointer}.btn{width:100%;border:0;border-radius:13px;padding:13px;font-weight:950;background:var(--accent);color:#0a0d11;margin-top:12px}.btn2{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px;font-weight:900;background:var(--panel2);color:var(--text);margin-top:8px}.mission{background:#0c1118;border:1px solid #38475d;border-radius:14px;padding:10px}.mission b{display:block;font-size:14px;margin-top:3px}.bar{height:8px;background:#252f3d;border-radius:999px;overflow:hidden;border:1px solid #344154}.fill{height:100%;width:100%;background:var(--good);transition:width .18s}.mfill{background:var(--accent);width:0}.hpLine{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:900;margin:0 0 4px}.battleShell{border:1px solid #334158;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 34%,rgba(216,255,62,.08),transparent 28%),linear-gradient(#141c27,#080c12)}.battleHud{padding:10px 11px 8px;border-bottom:1px solid rgba(51,65,88,.55)}.battleMission{margin-top:8px}.arena{height:360px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}.state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;opacity:0;pointer-events:none;transform:scale(.98);transition:opacity .18s ease,transform .18s ease}.state.on{opacity:1;pointer-events:auto;transform:scale(1)}.enemyState{flex-direction:column;text-align:center}.sprite{font-size:92px;line-height:1;filter:drop-shadow(0 15px 16px #0008)}.enemyIn .sprite{animation:enemyIn .24s ease-out}.enemyHit .sprite{animation:enemyHit .16s ease-out}.enemyDown .sprite{animation:enemyDown .48s ease forwards}.ename{font-size:20px;font-weight:950;margin-top:10px}.etag{font-size:10px;color:var(--muted);margin-top:4px}.enemyHpWrap{width:min(300px,88%);margin-top:12px}.defeatState{flex-direction:column;text-align:center}.defeatWord{font-size:30px;font-weight:1000;letter-spacing:.08em;color:var(--warn);text-shadow:0 0 24px rgba(255,209,102,.25)}.defeatSub{font-size:11px;color:var(--muted);margin-top:6px}.lootState{align-items:stretch}.lootCard{width:min(420px,100%);margin:auto;border:1px solid var(--line);background:linear-gradient(#171f2a,#0f151e);border-radius:18px;padding:12px;animation:lootIn .28s ease-out}.lootTop{display:flex;gap:12px;align-items:center}.lootIcon{width:82px;height:82px;flex:0 0 82px;border-radius:15px;background:#0a0f15;display:grid;place-items:center;font-size:48px}.lootInfo{min-width:0}.rar{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 7px;font-size:9px;font-weight:950}.iname{font-size:19px;font-weight:950;margin-top:6px;line-height:1.2}.lootDesc{font-size:10px;color:var(--muted);margin-top:4px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px}.metric{background:#0b1118;border:1px solid var(--line);border-radius:10px;padding:7px 5px;text-align:center;font-size:10px}.metric small{display:block;color:var(--muted);font-size:8px;margin-bottom:3px}.metric strong{font-size:13px}.lootActions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.action{border:1px solid var(--line);background:#0d131c;color:#dbe3ec;border-radius:11px;padding:9px;font-weight:850}.action.on{border-color:var(--accent);color:var(--accent)}.nextBtn{margin-top:8px}.potionState{flex-direction:column;text-align:center}.potionIcon{font-size:66px}.potionTitle{font-size:20px;font-weight:950;margin-top:7px}.potionText{font-size:11px;color:var(--muted);margin-top:5px}.actionZone{padding:9px 11px 11px;border-top:1px solid rgba(51,65,88,.55)}.msg{height:42px;border:1px solid var(--line);border-radius:11px;background:#070a0fc7;padding:8px 10px;font-size:11px;line-height:1.4;display:flex;align-items:center}.dice{width:100%;border:0;border-radius:14px;padding:13px;background:var(--accent);color:#090d11;font-size:16px;font-weight:950;margin-top:8px;cursor:pointer}.dice:disabled{opacity:.45}.run{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;margin-top:7px}.clear{text-align:center}.clear .ico{font-size:54px}.tabs{display:flex;gap:7px;overflow:auto;margin-top:16px}.tab{white-space:nowrap;border:1px solid var(--line);background:#0c121a;color:#bcc6d3;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:850}.tab.on{color:var(--accent);border-color:var(--accent)}.collection{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}.mini{border:1px solid var(--line);background:var(--panel);border-radius:14px;overflow:hidden}.miniPic{height:90px;background:#0b1118;display:grid;place-items:center;font-size:38px}.miniBody{padding:8px;font-size:11px;font-weight:850}.empty{border:1px dashed var(--line);border-radius:13px;padding:12px;color:var(--muted);font-size:12px}.hide{display:none!important}
@keyframes enemyIn{from{opacity:0;transform:translateX(34px) scale(.84)}to{opacity:1;transform:none}}
@keyframes enemyHit{0%{transform:none}35%{transform:translateX(9px) rotate(3deg)}70%{transform:translateX(-5px) rotate(-2deg)}100%{transform:none}}
@keyframes enemyDown{0%{opacity:1;transform:none;filter:drop-shadow(0 15px 16px #0008)}55%{opacity:1;transform:scale(1.13) rotate(-6deg);filter:brightness(1.8)}100%{opacity:0;transform:translateY(24px) scale(.55) rotate(10deg);filter:brightness(.5)}}
@keyframes lootIn{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}
@media(min-width:680px){.collection{grid-template-columns:repeat(4,1fr)}.arena{height:405px}}
@media(max-height:760px){.app{padding-top:8px}.brand{font-size:24px}.top .sub{display:none}.arena{height:315px}.sprite{font-size:78px}.battleHud{padding-top:8px}.msg{height:38px}.dice{padding:11px}.lootIcon{width:70px;height:70px;flex-basis:70px;font-size:42px}.iname{font-size:17px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="k">REAL PRODUCTS / DICE HACK & LOOT</div><div class="brand">LOOT MARKET</div><div class="sub">サイコロで倒す。実在商品を奪う。それだけ。</div></div>
    <div class="badge" id="bookBadge">図鑑 0 / 20</div>
  </div>
  <section id="stage" class="screen on"><div class="panel"><div class="k">SELECT DUNGEON</div><div class="card"><div class="k">STAGE 01</div><div class="title">禁断の生活雑貨庫</div><div class="sub">日用品、便利グッズ、企画会議の正気を疑う品々が眠る。</div><button class="btn" id="select">このダンジョンへ</button></div></div></section>
  <section id="brief" class="screen"><div class="panel"><div class="k">STAGE 01</div><div class="title">禁断の生活雑貨庫</div><div class="mission"><div class="k">BOSS APPEAR CONDITION</div><b id="briefMission"></b><div class="sub">条件達成までザコ敵が連続出現。</div></div><button class="btn" id="enter">ダンジョンに潜る</button><button class="btn2" id="back">戻る</button></div></section>
  <section id="battle" class="screen">
    <div class="battleShell">
      <div class="battleHud">
        <div class="hpLine"><span>PLAYER HP</span><span id="phpT"></span></div><div class="bar"><div class="fill" id="phpB"></div></div>
        <div class="battleMission mission"><div class="hpLine"><span class="k">BOSS CONDITION</span><span id="progT"></span></div><div class="bar"><div class="fill mfill" id="progB"></div></div><div class="sub" id="missionT"></div></div>
      </div>
      <div class="arena" id="arena">
        <div id="enemyState" class="state enemyState on"><div class="sprite" id="sprite"></div><div class="ename" id="ename"></div><div class="etag" id="etag"></div><div class="enemyHpWrap"><div class="hpLine"><span id="ehpL">ENEMY HP</span><span id="ehpT"></span></div><div class="bar"><div class="fill" id="ehpB" style="background:var(--bad)"></div></div></div></div>
        <div id="defeatState" class="state defeatState"><div class="defeatWord">DEFEATED</div><div class="defeatSub" id="defeatSub">敵を撃破</div></div>
        <div id="lootState" class="state lootState"></div>
        <div id="potionState" class="state potionState"></div>
      </div>
      <div class="actionZone" id="actionZone"><div class="msg" id="msg">サイコロを振れ。</div><button class="dice" id="roll">🎲 サイコロを振る</button><div class="run"><span id="kills"></span><span id="loots"></span><span id="pots"></span></div></div>
    </div>
  </section>
  <section id="result" class="screen"><div class="panel clear"><div class="ico" id="rIco"></div><div class="title" id="rTitle"></div><div class="sub" id="rSub"></div><button class="btn" id="retry">もう一度潜る</button><button class="btn2" id="home">ステージ選択へ</button></div></section>
  <div id="collectionArea"><div class="tabs"><button class="tab on" data-t="d">発見図鑑</button><button class="tab" data-t="w">欲しい</button><button class="tab" data-t="o">持ってる</button></div><div class="collection" id="collection"></div></div>
</div>
<script>
const S={maxHp:30,pHeal:7,pRate:.14,rbRate:.05,enemies:[['収納ミミック','📦',8,1,2],['暴走モップ','🧹',9,1,3],['逆襲の目覚まし','⏰',10,1,3],['無限ティッシュ','🧻',11,2,3],['家電ゴーレム','🧺',12,2,3]],boss:['在庫王 ザ・デッドストック','🗿',28,2,4],rboss:['返品不可神 カエセナイ','👁️',34,3,5],missions:[['weird','「意味不明 ★★★★★」を2種類発見せよ',2],['rare','RARE以上の商品を3種類発見せよ',3],['gift','「プレゼント力 ★★★★★」を2種類発見せよ',2],['kill','ザコ敵を5体撃破せよ',5],['uncommon','UNCOMMON以上の商品を4種類発見せよ',4]],items:[['p01','バナナ専用ケース','UNCOMMON','🍌',980,4,3,4],['p02','電動回転フォーク','RARE','🍝',2480,5,2,4],['p03','USBカップウォーマー','COMMON','☕',1680,2,4,3],['p04','指だけ出るミニ傘','EPIC','☂️',1180,5,1,5],['p05','猫の肉球マウスパッド','COMMON','🐾',1280,2,4,4],['p06','自動かき混ぜマグ','RARE','🥤',1980,4,3,4],['p07','鼻型メガネスタンド','RARE','👃',1580,5,3,5],['p08','寿司型USBメモリ','UNCOMMON','🍣',1480,4,4,4],['p09','ミニ卓上掃除機','COMMON','🧹',1780,2,5,3],['p10','頭皮マッサージ謎装置','EPIC','🧠',980,5,3,5],['p11','携帯バナナカッター','EPIC','🔪',780,5,1,5],['p12','光る靴ひも','UNCOMMON','👟',1380,4,2,4],['p13','机用ミニパンチングマシン','EPIC','🥊',2980,5,2,5],['p14','アヒル型ケーブルカバー','COMMON','🦆',680,3,4,4],['p15','巨大Enterキークッション','LEGENDARY','⌨️',3280,5,3,5],['p16','トースト型加湿器','RARE','🍞',2380,4,4,5],['p17','魚型スリッパ','EPIC','🐟',1880,5,3,5],['p18','デスク用ミニ冷蔵庫','RARE','🧊',3980,3,4,4],['p19','カニ型ペンホルダー','LEGENDARY','🦀',2180,5,3,5],['p20','雲型ティッシュケース','UNCOMMON','☁️',1980,3,4,4]]};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let mem={d:new Set(),w:new Set(),o:new Set()},tab='d',mission,run,enemy,ehp,isBoss=false,bossQ=false,locked=false,currentLoot=null;
try{['d','w','o'].forEach(k=>mem[k]=new Set(JSON.parse(localStorage.getItem('loot-'+k)||'[]')))}catch(e){}
function save(){try{['d','w','o'].forEach(k=>localStorage.setItem('loot-'+k,JSON.stringify([...mem[k]])))}catch(e){}}
function show(id){$$('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');collectionArea.classList.toggle('hide',id==='#battle'||id==='#brief');window.scrollTo(0,0)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}function item(id){return S.items.find(x=>x[0]===id)}function rank(r){return{COMMON:0,UNCOMMON:1,RARE:2,EPIC:3,LEGENDARY:4}[r]}function stars(n){return'★'.repeat(n)+'☆'.repeat(5-n)}
function render(){bookBadge.textContent='図鑑 '+mem.d.size+' / '+S.items.length;let arr=[...mem[tab]].map(item).filter(Boolean);collection.innerHTML=arr.length?arr.map(x=>`<div class="mini"><div class="miniPic">${x[3]}</div><div class="miniBody">${x[1]}<div class="sub">${x[2]} / 意味不明★${x[5]}</div></div></div>`).join(''):'<div class="empty">まだ何もない。</div>'}
function setArena(state){['enemyState','defeatState','lootState','potionState'].forEach(id=>$('#'+id).classList.toggle('on',id===state));actionZone.classList.toggle('hide',state!=='enemyState')}
function pMission(){mission=pick(S.missions);briefMission.textContent=mission[1]}
function start(){run={hp:S.maxHp,kills:0,loot:[],pots:0,rare:false};bossQ=false;isBoss=false;locked=false;currentLoot=null;show('#battle');spawn()}
function spawn(){isBoss=bossQ;if(isBoss){run.rare=Math.random()<S.rbRate;enemy=run.rare?S.rboss:S.boss}else enemy=pick(S.enemies);ehp=enemy[2];sprite.textContent=enemy[1];ename.textContent=enemy[0];etag.textContent=isBoss?(run.rare?'RARE BOSS':'BOSS'):'ZAKO';ehpL.textContent=isBoss?'BOSS HP':'ENEMY HP';msg.textContent=enemy[0]+' が現れた。サイコロを振れ。';enemyState.classList.remove('enemyHit','enemyDown');void enemyState.offsetWidth;enemyState.classList.add('enemyIn');setArena('enemyState');locked=false;roll.disabled=false;ui();setTimeout(()=>enemyState.classList.remove('enemyIn'),300)}
function progress(){let u=[...new Set(run.loot)].map(item);if(mission[0]=='weird')return u.filter(x=>x[5]==5).length;if(mission[0]=='rare')return u.filter(x=>rank(x[2])>=2).length;if(mission[0]=='gift')return u.filter(x=>x[7]==5).length;if(mission[0]=='kill')return run.kills;if(mission[0]=='uncommon')return u.filter(x=>rank(x[2])>=1).length;return 0}
function ui(){phpT.textContent=Math.max(0,run.hp)+' / '+S.maxHp;phpB.style.width=Math.max(0,run.hp)/S.maxHp*100+'%';ehpT.textContent=Math.max(0,ehp)+' / '+enemy[2];ehpB.style.width=Math.max(0,ehp)/enemy[2]*100+'%';let p=Math.min(mission[2],progress());progT.textContent=p+' / '+mission[2];progB.style.width=p/mission[2]*100+'%';missionT.textContent=mission[1];kills.textContent='撃破 '+run.kills;loots.textContent='戦利品 '+run.loot.length;pots.textContent='ポーション '+run.pots}
function rollDice(){if(locked||run.hp<=0||ehp<=0)return;locked=true;roll.disabled=true;let n=ri(1,6);ehp-=n;enemyState.classList.remove('enemyHit');void enemyState.offsetWidth;enemyState.classList.add('enemyHit');if(ehp<=0){msg.textContent='🎲 '+n+'！ '+enemy[0]+' を撃破！';ui();enemyState.classList.remove('enemyHit');enemyState.classList.add('enemyDown');setTimeout(()=>showDefeat(),430);return}let d=ri(enemy[3],enemy[4]);run.hp-=d;msg.textContent='🎲 '+n+'！ '+n+'ダメージ。反撃で '+d+'ダメージ。';ui();if(run.hp<=0)setTimeout(gameOver,260);else{setTimeout(()=>enemyState.classList.remove('enemyHit'),170);locked=false;roll.disabled=false}}
function dropItem(minRank=-1){let pool=S.items.filter(x=>rank(x[2])>=minRank&&!run.loot.includes(x[0]));if(!pool.length)pool=S.items.filter(x=>rank(x[2])>=minRank);return pick(pool)}
function showDefeat(){defeatSub.textContent=enemy[0]+' を撃破';setArena('defeatState');setTimeout(win,520)}
function win(){if(isBoss){showLoot(dropItem(2),true);return}run.kills++;if(Math.random()<S.pRate){run.pots++;let before=run.hp;run.hp=Math.min(S.maxHp,run.hp+S.pHeal);showPotion(run.hp-before)}else showLoot(dropItem(),false);ui()}
function showPotion(h){potionState.innerHTML=`<div class="potionIcon">🧪</div><div class="potionTitle">回復ポーション</div><div class="potionText">HPを ${h} 回復した。</div><button class="btn2 nextBtn" id="nextPotion">次へ</button>`;setArena('potionState');nextPotion.onclick=cont}
function showLoot(x,boss){currentLoot=x;run.loot.push(x[0]);mem.d.add(x[0]);save();render();lootState.innerHTML=`<div class="lootCard"><div class="lootTop"><div class="lootIcon">${x[3]}</div><div class="lootInfo"><span class="rar">${x[2]}${boss?' ・ BOSS LOOT':''}</span><div class="iname">${x[1]}</div><div class="lootDesc">実在商品デモ / 参考価格 ¥${x[4].toLocaleString()}</div></div></div><div class="metrics"><div class="metric"><small>意味不明</small><strong>${stars(x[5])}</strong></div><div class="metric"><small>実用性</small><strong>${stars(x[6])}</strong></div><div class="metric"><small>プレゼント力</small><strong>${stars(x[7])}</strong></div></div><div class="lootActions"><button class="action ${mem.w.has(x[0])?'on':''}" id="wish">♡ 欲しい</button><button class="action ${mem.o.has(x[0])?'on':''}" id="own">✓ 持ってる</button></div><button class="btn nextBtn" id="nextLoot">${boss?'クリア結果へ':'次へ'}</button></div>`;setArena('lootState');wish.onclick=()=>tog('w',x[0],wish);own.onclick=()=>tog('o',x[0],own);nextLoot.onclick=boss?clearStage:cont}
function tog(k,id,el){mem[k].has(id)?mem[k].delete(id):mem[k].add(id);el.classList.toggle('on',mem[k].has(id));save();render()}
function cont(){if(progress()>=mission[2])bossQ=true;spawn()}
function gameOver(){rIco.textContent='💀';rTitle.textContent='GAME OVER';rSub.innerHTML='撃破 '+run.kills+'体 / 戦利品 '+run.loot.length+'個。<br>発見商品は図鑑に残ります。';show('#result')}
function clearStage(){rIco.textContent=run.rare?'👁️':'🏆';rTitle.textContent=run.rare?'RARE BOSS CLEAR':'STAGE CLEAR';rSub.innerHTML='撃破 '+run.kills+'体 / 戦利品 '+run.loot.length+'個 / 残りHP '+Math.max(0,run.hp);show('#result')}
select.onclick=()=>{pMission();show('#brief')};back.onclick=()=>show('#stage');enter.onclick=start;roll.onclick=rollDice;retry.onclick=()=>{pMission();show('#brief')};home.onclick=()=>show('#stage');$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.t;render()});render();
</script>
</body>
</html>
