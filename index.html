<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>LOOT MARKET</title>
<style>
:root{--bg:#080b10;--p:#111720;--p2:#171f2b;--line:#293446;--text:#f4f7fa;--muted:#8f9bad;--a:#d8ff3e;--good:#79f2a7;--bad:#ff6f7d;--warn:#ffd166;--rare:#c88dff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{font:inherit}button{touch-action:manipulation}body{min-height:100vh}.app{width:min(760px,100%);margin:auto;padding:12px 12px 54px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:8px}.brand{font-size:27px;font-weight:950;letter-spacing:-.05em;line-height:1}.k{font-size:9px;letter-spacing:.16em;color:var(--a);font-weight:900}.sub{font-size:11px;color:var(--muted);line-height:1.5}.badge{border:1px solid var(--line);border-radius:999px;padding:7px 9px;font-size:10px;white-space:nowrap}.screen{display:none}.screen.on{display:block}.panel{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.stageGrid{display:grid;gap:10px}.card{border:1px solid #39475e;border-radius:16px;background:linear-gradient(145deg,#17202c,#0e141d);padding:16px;overflow:hidden;position:relative}.stagePic{height:148px;margin:-16px -16px 14px;background:#0b1118;display:grid;place-items:center;color:#536174;font-size:38px;overflow:hidden}.stagePic img{width:100%;height:100%;object-fit:cover}.stageMeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.tiny{border:1px solid var(--line);border-radius:999px;padding:4px 7px;font-size:9px;color:#aeb8c6}.title{font-size:22px;font-weight:950;margin:4px 0}.btn,.btn2,.action,.dice,.warningBtn{cursor:pointer}.btn{width:100%;border:0;border-radius:13px;padding:13px;font-weight:950;background:var(--a);color:#0a0d11;margin-top:12px}.btn:disabled{opacity:.4;cursor:not-allowed}.btn2{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px;font-weight:900;background:var(--p2);color:var(--text);margin-top:8px}.mission{background:#0c1118;border:1px solid #38475d;border-radius:14px;padding:10px}.mission b{display:block;font-size:14px;margin-top:3px}.bar{height:8px;background:#252f3d;border-radius:999px;overflow:hidden;border:1px solid #344154}.fill{height:100%;width:100%;background:var(--good);transition:width .18s}.mfill{background:var(--a);width:0}.hpLine{display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:900;margin:0 0 4px}.battleShell{border:1px solid #334158;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 34%,rgba(216,255,62,.08),transparent 28%),linear-gradient(#141c27,#080c12);position:relative}.battleShell:before{content:"";position:absolute;inset:0;background:var(--stage-bg,none) center/cover;opacity:.08;pointer-events:none}.battleShell>*{position:relative}.battleHud{padding:10px 11px 8px;border-bottom:1px solid #33415888}.battleMission{margin-top:8px}.arena{height:360px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}.state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;opacity:0;pointer-events:none;transform:scale(.98);transition:opacity .18s,transform .18s}.state.on{opacity:1;pointer-events:auto;transform:scale(1)}.enemyState,.defeatState,.potionState,.warningState{flex-direction:column;text-align:center}.sprite{width:150px;height:150px;display:grid;place-items:center;font-size:92px;line-height:1;filter:drop-shadow(0 15px 16px #0008);overflow:hidden;border-radius:18px}.sprite img{width:100%;height:100%;object-fit:contain}.enemyIn .sprite{animation:enemyIn .24s ease-out}.enemyHit .sprite{animation:enemyHit .16s ease-out}.ename{font-size:20px;font-weight:950;margin-top:10px}.etag{font-size:10px;color:var(--muted);margin-top:4px}.enemyHpWrap{width:min(300px,88%);margin-top:12px}.defeatWord{font-size:30px;font-weight:1000;letter-spacing:.08em;color:var(--warn)}.defeatSub{font-size:11px;color:var(--muted);margin-top:6px}.lootState{align-items:stretch}.lootCard{width:min(420px,100%);margin:auto;border:1px solid var(--line);background:linear-gradient(#171f2a,#0f151e);border-radius:18px;padding:12px;animation:lootIn .28s ease-out}.lootTop{display:flex;gap:12px;align-items:center}.lootIcon{width:92px;height:92px;flex:0 0 92px;border-radius:15px;background:#0a0f15;display:grid;place-items:center;font-size:42px;overflow:hidden}.lootIcon img{width:100%;height:100%;object-fit:contain;background:#fff}.lootInfo{min-width:0}.rar{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 7px;font-size:9px;font-weight:950}.iname{font-size:19px;font-weight:950;margin-top:6px;line-height:1.2}.lootDesc{font-size:10px;color:var(--muted);margin-top:4px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px}.metric{background:#0b1118;border:1px solid var(--line);border-radius:10px;padding:7px 5px;text-align:center;font-size:10px}.metric small{display:block;color:var(--muted);font-size:8px;margin-bottom:3px}.metric strong{font-size:13px}.lootActions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.action{border:1px solid var(--line);background:#0d131c;color:#dbe3ec;border-radius:11px;padding:9px;font-weight:850}.action.on{border-color:var(--a);color:var(--a)}.shopLink{display:block;text-align:center;text-decoration:none;border:1px solid #647431;color:var(--a);background:#11180b;border-radius:11px;padding:9px;font-size:11px;font-weight:900;margin-top:7px}.potionIcon{font-size:66px}.potionTitle{font-size:20px;font-weight:950;margin-top:7px}.potionText{font-size:11px;color:var(--muted);margin-top:5px}.warningPanel{width:min(430px,100%);margin:auto;border:1px solid #84303b;border-radius:20px;background:linear-gradient(#351017,#17090c);padding:22px 18px;box-shadow:0 0 38px #ff4b5f38;position:relative;overflow:hidden}.warningPanel:before,.warningPanel:after{content:"WARNING";position:absolute;left:-8%;right:-8%;font-size:18px;font-weight:1000;letter-spacing:.34em;color:#ffffff10;transform:rotate(-8deg)}.warningPanel:before{top:16px}.warningPanel:after{bottom:16px}.warningMini{font-size:10px;letter-spacing:.24em;color:#ff9aa6;font-weight:900}.warningWord{font-size:40px;font-weight:1000;letter-spacing:.08em;color:#fff;margin-top:8px;text-shadow:0 0 20px #ff4b5f77;animation:blink .8s linear infinite}.warningBody{font-size:12px;line-height:1.7;color:#f0c9cf;margin-top:12px}.warningBoss{font-size:18px;font-weight:950;color:var(--warn);margin-top:10px}.warningBtn{width:100%;margin-top:16px;border:1px solid #a74350;border-radius:13px;padding:12px;font-weight:950;background:#2a0e14;color:#fff}.warningPanel.rare{border-color:#a66cff;background:radial-gradient(circle at 50% 40%,#2b1746,#0d0713 70%);box-shadow:0 0 48px #c88dff55;animation:rareShake .13s linear 4}.warningPanel.rare:before,.warningPanel.rare:after{content:"UNKNOWN SIGNAL";color:#c88dff1c}.rare .warningMini{color:#dcbcff}.rare .warningWord{color:#efe3ff;text-shadow:0 0 22px #c88dff;animation:glitch .45s steps(2,end) infinite}.rare .warningBoss{color:#ff82ee}.rare .warningBtn{border-color:#8d5bc9;background:#21102f}.rareSig{font-size:11px;letter-spacing:.12em;color:#ff82ee;margin-top:8px}.actionZone{padding:9px 11px 11px;border-top:1px solid #33415888}.msg{height:42px;border:1px solid var(--line);border-radius:11px;background:#070a0fc7;padding:8px 10px;font-size:11px;line-height:1.4;display:flex;align-items:center}.dice{width:100%;border:0;border-radius:14px;padding:13px;background:var(--a);color:#090d11;font-size:16px;font-weight:950;margin-top:8px}.dice:disabled{opacity:.35}.run{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;margin-top:7px}.clear{text-align:center}.clear .ico{font-size:54px}.tabs{display:flex;gap:7px;overflow:auto;margin-top:16px}.tab{white-space:nowrap;border:1px solid var(--line);background:#0c121a;color:#bcc6d3;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:850}.tab.on{color:var(--a);border-color:var(--a)}.collection{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}.mini{border:1px solid var(--line);background:var(--p);border-radius:14px;overflow:hidden}.miniPic{height:104px;background:#0b1118;display:grid;place-items:center;font-size:38px;overflow:hidden}.miniPic img{width:100%;height:100%;object-fit:contain;background:#fff}.miniBody{padding:8px;font-size:11px;font-weight:850}.empty{border:1px dashed var(--line);border-radius:13px;padding:12px;color:var(--muted);font-size:12px}.loading{text-align:center;padding:32px 12px;color:var(--muted)}.errorBox{border:1px solid #62323a;background:#291319;color:#ffb1b8;border-radius:14px;padding:13px;font-size:12px;line-height:1.6}.hide{display:none!important}@keyframes enemyIn{from{opacity:0;transform:translateX(34px) scale(.84)}to{opacity:1;transform:none}}@keyframes enemyHit{35%{transform:translateX(9px) rotate(3deg)}70%{transform:translateX(-5px) rotate(-2deg)}}@keyframes lootIn{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}@keyframes blink{50%{opacity:.4}}@keyframes rareShake{25%{transform:translateX(3px)}75%{transform:translateX(-3px)}}@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,1px)}}@media(min-width:680px){.collection{grid-template-columns:repeat(4,1fr)}.stageGrid{grid-template-columns:repeat(2,1fr)}.arena{height:405px}}@media(max-height:760px){.brand{font-size:24px}.top .sub{display:none}.arena{height:315px}.sprite{width:126px;height:126px;font-size:76px}.warningWord{font-size:34px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="k">REAL PRODUCTS / DICE HACK & LOOT</div><div class="brand">LOOT MARKET</div><div class="sub">サイコロで倒す。実在商品を奪う。それだけ。</div></div>
    <div class="badge" id="bookBadge">図鑑 - / -</div>
  </div>
  <section id="stage" class="screen on"><div class="panel"><div class="k">SELECT DUNGEON</div><div id="stageList" class="stageGrid"><div class="loading">ダンジョンデータを読み込み中…</div></div></div></section>
  <section id="brief" class="screen"><div class="panel"><div class="k" id="briefStageNo">STAGE</div><div class="title" id="briefTitle"></div><div class="sub" id="briefDesc"></div><div class="mission" style="margin-top:12px"><div class="k">BOSS APPEAR CONDITION</div><b id="briefMission"></b><div class="sub">条件達成までザコ敵が連続出現。</div></div><button class="btn" id="enter">ダンジョンに潜る</button><button class="btn2" id="back">戻る</button></div></section>
  <section id="battle" class="screen">
    <div class="battleShell" id="battleShell"><div class="battleHud"><div class="hpLine"><span>PLAYER HP</span><span id="phpT"></span></div><div class="bar"><div class="fill" id="phpB"></div></div><div class="battleMission mission"><div class="hpLine"><span class="k">BOSS CONDITION</span><span id="progT"></span></div><div class="bar"><div class="fill mfill" id="progB"></div></div><div class="sub" id="missionT"></div></div></div><div class="arena"><div id="enemyState" class="state enemyState on"><div class="sprite" id="sprite"></div><div class="ename" id="ename"></div><div class="etag" id="etag"></div><div class="enemyHpWrap"><div class="hpLine"><span id="ehpL">ENEMY HP</span><span id="ehpT"></span></div><div class="bar"><div class="fill" id="ehpB" style="background:var(--bad)"></div></div></div></div><div id="defeatState" class="state defeatState"><div class="defeatWord">DEFEATED</div><div class="defeatSub" id="defeatSub"></div></div><div id="lootState" class="state lootState"></div><div id="potionState" class="state potionState"></div><div id="warningState" class="state warningState"></div></div><div class="actionZone"><div class="msg" id="msg">サイコロを振れ。</div><button class="dice" id="roll">🎲 サイコロを振る</button><div class="run"><span id="kills"></span><span id="loots"></span><span id="pots"></span></div></div></div>
  </section>
  <section id="result" class="screen"><div class="panel clear"><div class="ico" id="rIco"></div><div class="title" id="rTitle"></div><div class="sub" id="rSub"></div><button class="btn" id="retry">もう一度潜る</button><button class="btn2" id="home">ステージ選択へ</button></div></section>
  <div id="collectionArea"><div class="tabs"><button class="tab on" data-t="d">発見図鑑</button><button class="tab" data-t="w">欲しい</button><button class="tab" data-t="o">持ってる</button></div><div class="collection" id="collection"></div></div>
</div>
<script>
const API='https://loot-market.c-media-satoru.workers.dev';
const GAME={maxHp:30,pHeal:7,pRate:.14};
const RARITY={1:'COMMON',2:'UNCOMMON',3:'RARE',4:'EPIC',5:'LEGENDARY'};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let catalog=[],selectedStage=null,allItems=[],itemMap=new Map(),tab='d',mission,run,enemy,ehp,isBoss=false,bossQ=false,locked=false;
let mem={d:new Set(),w:new Set(),o:new Set()};
try{['d','w','o'].forEach(k=>mem[k]=new Set(JSON.parse(localStorage.getItem('loot-'+k)||'[]')))}catch(e){}
function save(){try{['d','w','o'].forEach(k=>localStorage.setItem('loot-'+k,JSON.stringify([...mem[k]])))}catch(e){}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeUrl(v){try{const u=new URL(String(v||''),location.href);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return''}}
function mediaUrl(key){return key?`${API}/api/media/${String(key).split('/').map(encodeURIComponent).join('/')}`:''}
function imgSrc(obj){return safeUrl(obj?.image_url)||mediaUrl(obj?.image_key)||''}
function rank(n){return Number(n)||1}
function stars(n){n=Math.max(0,Math.min(5,Number(n)||0));return'★'.repeat(n)+'☆'.repeat(5-n)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function weightedPick(rows,weightKey){const valid=(rows||[]).filter(Boolean);if(!valid.length)return null;const weights=valid.map(r=>Math.max(0,Number(r[weightKey])||0)),total=weights.reduce((a,b)=>a+b,0);if(total<=0)return pick(valid);let n=Math.random()*total;for(let i=0;i<valid.length;i++){n-=weights[i];if(n<=0)return valid[i]}return valid[valid.length-1]}
function item(id){return itemMap.get(id)}
function show(id){$$('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');$('#collectionArea').classList.toggle('hide',id==='#battle');scrollTo(0,0)}
function setArena(id){['enemyState','defeatState','lootState','potionState','warningState'].forEach(x=>$('#'+x).classList.toggle('on',x===id))}
function renderStageList(){const root=$('#stageList');if(!catalog.length){root.innerHTML='<div class="empty">公開中のステージがありません。</div>';return}root.innerHTML=catalog.map((s,i)=>{const pic=imgSrc(s),ready=(s.enemies?.length&&s.bosses?.length&&s.items?.length&&s.conditions?.length);return `<div class="card">${pic?`<div class="stagePic"><img src="${esc(pic)}" alt=""></div>`:'<div class="stagePic">🗺️</div>'}<div class="k">STAGE ${String(i+1).padStart(2,'0')}</div><div class="title">${esc(s.name)}</div><div class="sub">${esc(s.description||'')}</div><div class="stageMeta"><span class="tiny">敵 ${s.enemies?.length||0}</span><span class="tiny">ボス ${s.bosses?.length||0}</span><span class="tiny">戦利品 ${s.items?.length||0}</span></div><button class="btn stageSelect" data-id="${esc(s.id)}" ${ready?'':'disabled'}>${ready?'このダンジョンへ':'準備中'}</button></div>`}).join('');$$('.stageSelect').forEach(b=>b.onclick=()=>selectStage(b.dataset.id))}
function render(){bookBadge.textContent='図鑑 '+mem.d.size+' / '+allItems.length;let arr=[...mem[tab]].map(item).filter(Boolean);collection.innerHTML=arr.length?arr.map(x=>{const src=imgSrc(x);return `<div class="mini"><div class="miniPic">${src?`<img src="${esc(src)}" alt="">`:'📦'}</div><div class="miniBody">${esc(x.name)}<div class="sub">${RARITY[rank(x.rarity)]||'UNKNOWN'} / 意味不明★${Number(x.weirdness)||0}</div></div></div>`}).join(''):'<div class="empty">まだ何もない。</div>'}
async function loadCatalog(){try{const res=await fetch(API+'/api/catalog',{cache:'no-store'});const j=await res.json();if(!res.ok||!j.ok)throw new Error(j.error||('HTTP '+res.status));catalog=j.data||[];allItems=catalog.flatMap(s=>s.items||[]);itemMap=new Map(allItems.map(x=>[x.id,x]));try{localStorage.setItem('loot-catalog-cache',JSON.stringify({at:Date.now(),data:catalog}))}catch{}renderStageList();render()}catch(err){let cached=null;try{cached=JSON.parse(localStorage.getItem('loot-catalog-cache')||'null')}catch{}if(cached?.data?.length){catalog=cached.data;allItems=catalog.flatMap(s=>s.items||[]);itemMap=new Map(allItems.map(x=>[x.id,x]));renderStageList();render();$('#stageList').insertAdjacentHTML('afterbegin','<div class="errorBox">通信できないため、前回取得したデータで表示しています。</div>')}else{$('#stageList').innerHTML=`<div class="errorBox">ゲームデータを取得できませんでした。<br>${esc(err.message)}<button class="btn2" id="retryLoad">再読み込み</button></div>`;$('#retryLoad').onclick=loadCatalog}}}
function selectStage(id){selectedStage=catalog.find(s=>s.id===id);if(!selectedStage)return;const i=catalog.indexOf(selectedStage);$('#briefStageNo').textContent='STAGE '+String(i+1).padStart(2,'0');$('#briefTitle').textContent=selectedStage.name;$('#briefDesc').textContent=selectedStage.description||'';const bg=imgSrc(selectedStage);$('#battleShell').style.setProperty('--stage-bg',bg?`url("${bg.replace(/["\\]/g,'')}")`:'none');pMission();show('#brief')}
function pMission(){mission=pick(selectedStage.conditions||[]);$('#briefMission').textContent=mission?.label||'ボス条件がありません'}
function start(){if(!selectedStage||!mission)return;run={hp:GAME.maxHp,kills:0,loot:[],pots:0,boss:null};bossQ=false;isBoss=false;show('#battle');spawn()}
function renderEnemyVisual(row){const src=imgSrc(row);$('#sprite').innerHTML=src?`<img src="${esc(src)}" alt="">`:(row?.is_rare?'👁️':isBoss?'👹':'👾')}
function spawn(){isBoss=bossQ;if(isBoss){enemy=run.boss}else{enemy=weightedPick(selectedStage.enemies||[],'spawn_weight')}if(!enemy){gameError('出現できる敵がいません');return}ehp=Number(enemy.hp);renderEnemyVisual(enemy);$('#ename').textContent=enemy.name;$('#etag').textContent=isBoss?(Number(enemy.is_rare)?'RARE BOSS':'BOSS'):'ZAKO';$('#ehpL').textContent=isBoss?'BOSS HP':'ENEMY HP';$('#msg').textContent=isBoss?'ボスが出現した。決戦だ。':enemy.name+' が現れた。サイコロを振れ。';setArena('enemyState');$('#enemyState').className='state enemyState on enemyIn';setTimeout(()=>$('#enemyState').className='state enemyState on',240);locked=false;$('#roll').disabled=false;ui()}
function progress(){const u=[...new Set(run.loot)].map(item).filter(Boolean);switch(mission?.type){case'weird':return u.filter(x=>Number(x.weirdness)===5).length;case'rare':return u.filter(x=>rank(x.rarity)>=3).length;case'gift':return u.filter(x=>Number(x.gift_power)===5).length;case'kill':return run.kills;case'uncommon':return u.filter(x=>rank(x.rarity)>=2).length;default:return 0}}
function ui(){$('#phpT').textContent=Math.max(0,run.hp)+' / '+GAME.maxHp;$('#phpB').style.width=Math.max(0,run.hp)/GAME.maxHp*100+'%';$('#ehpT').textContent=Math.max(0,ehp)+' / '+enemy.hp;$('#ehpB').style.width=Math.max(0,ehp)/enemy.hp*100+'%';let p=Math.min(Number(mission.target_value)||1,progress());$('#progT').textContent=p+' / '+mission.target_value;$('#progB').style.width=p/mission.target_value*100+'%';$('#missionT').textContent=mission.label;$('#kills').textContent='撃破 '+run.kills;$('#loots').textContent='戦利品 '+run.loot.length;$('#pots').textContent='ポーション '+run.pots}
function rollDice(){if(locked||run.hp<=0||ehp<=0)return;locked=true;$('#roll').disabled=true;let n=ri(1,6);ehp-=n;$('#enemyState').className='state enemyState on enemyHit';setTimeout(()=>$('#enemyState').className='state enemyState on',170);if(ehp<=0){$('#msg').textContent='🎲 '+n+'！ '+enemy.name+' を撃破！';ui();setTimeout(showDefeat,180);return}let d=ri(Number(enemy.attack_min),Number(enemy.attack_max));run.hp-=d;$('#msg').textContent='🎲 '+n+'！ '+n+'ダメージ。反撃で '+d+'ダメージ。';ui();if(run.hp<=0)setTimeout(gameOver,180);else{locked=false;$('#roll').disabled=false}}
function showDefeat(){$('#defeatSub').textContent=isBoss?'ボスを撃破した':'敵を撃破した';setArena('defeatState');setTimeout(win,520)}
function dropItem(min=1){let pool=(selectedStage.items||[]).filter(x=>rank(x.rarity)>=min&&!run.loot.includes(x.id));if(!pool.length)pool=(selectedStage.items||[]).filter(x=>rank(x.rarity)>=min);if(!pool.length)pool=selectedStage.items||[];return pool.length?pick(pool):null}
function win(){if(isBoss){const loot=dropItem(Number(enemy.min_loot_rarity)||3);if(!loot){clearStage();return}showLoot(loot,true);return}run.kills++;if(Math.random()<GAME.pRate){run.pots++;let b=run.hp;run.hp=Math.min(GAME.maxHp,run.hp+GAME.pHeal);showPotion(run.hp-b)}else{const loot=dropItem();if(loot)showLoot(loot,false);else cont()}ui()}
function showPotion(h){$('#potionState').innerHTML=`<div class="potionIcon">🧪</div><div class="potionTitle">回復ポーション</div><div class="potionText">HPを ${h} 回復した。</div><button class="btn2" id="nextPotion">次へ</button>`;setArena('potionState');$('#nextPotion').onclick=cont;$('#msg').textContent='ポーションを入手。'}
function showLoot(x,boss){run.loot.push(x.id);mem.d.add(x.id);save();render();const src=imgSrc(x),shop=safeUrl(x.affiliate_url),rarity=RARITY[rank(x.rarity)]||'UNKNOWN';$('#lootState').innerHTML=`<div class="lootCard"><div class="lootTop"><div class="lootIcon">${src?`<img src="${esc(src)}" alt="">`:'📦'}</div><div class="lootInfo"><span class="rar">${rarity}${boss?' ・ BOSS LOOT':''}</span><div class="iname">${esc(x.name)}</div><div class="lootDesc">${esc(x.description||x.category||x.provider||'実在商品')}</div></div></div><div class="metrics"><div class="metric"><small>意味不明</small><strong>${stars(x.weirdness)}</strong></div><div class="metric"><small>実用性</small><strong>${stars(x.usefulness)}</strong></div><div class="metric"><small>プレゼント力</small><strong>${stars(x.gift_power)}</strong></div></div><div class="lootActions"><button class="action ${mem.w.has(x.id)?'on':''}" id="wish">♡ 欲しい</button><button class="action ${mem.o.has(x.id)?'on':''}" id="own">✓ 持ってる</button></div>${shop?`<a class="shopLink" href="${esc(shop)}" target="_blank" rel="nofollow sponsored noopener">実物を見る ↗</a>`:''}<button class="btn2" id="nextLoot">${boss?'クリア結果へ':'次へ'}</button></div>`;setArena('lootState');$('#wish').onclick=()=>tog('w',x.id,$('#wish'));$('#own').onclick=()=>tog('o',x.id,$('#own'));$('#nextLoot').onclick=boss?clearStage:cont;$('#msg').textContent='戦利品を獲得。'}
function chooseBoss(){const bosses=selectedStage.bosses||[];run.boss=weightedPick(bosses,'encounter_rate')||bosses[0]||null;return run.boss}
function showWarning(){const b=chooseBoss();if(!b){gameError('ボスが設定されていません');return}$('#roll').disabled=true;locked=true;let rare=Number(b.is_rare)===1;$('#warningState').innerHTML=rare?`<div class="warningPanel rare"><div class="warningMini">UNIDENTIFIED HOSTILE SIGNAL</div><div class="warningWord">DANGER</div><div class="rareSig">UNKNOWN SIGNAL DETECTED</div><div class="warningBody">通常個体とは異なる反応を検知。<br>識別不能な敵性存在が接近しています。</div><div class="warningBoss">RARE BOSS 出現</div><button class="warningBtn" id="warningGo">接触する</button></div>`:`<div class="warningPanel"><div class="warningMini">BOSS ALERT</div><div class="warningWord">WARNING</div><div class="warningBody">ダンジョン内の異常反応を検知。<br>強力な敵性在庫が接近しています。</div><div class="warningBoss">BOSS 出現</div><button class="warningBtn" id="warningGo">ボス戦へ</button></div>`;setArena('warningState');$('#msg').textContent=rare?'識別不能な反応。何かがおかしい。':'警告。ボスが出現する。';$('#warningGo').onclick=spawn}
function tog(k,id,el){mem[k].has(id)?mem[k].delete(id):mem[k].add(id);el.classList.toggle('on',mem[k].has(id));save();render()}
function cont(){if(progress()>=Number(mission.target_value)&&!bossQ){bossQ=true;showWarning();return}spawn()}
function gameOver(){$('#rIco').textContent='💀';$('#rTitle').textContent='GAME OVER';$('#rSub').innerHTML='撃破 '+run.kills+'体 / 戦利品 '+run.loot.length+'個。<br>発見商品は図鑑に残ります。';show('#result')}
function clearStage(){const rare=Number(run.boss?.is_rare)===1;$('#rIco').textContent=rare?'👁️':'🏆';$('#rTitle').textContent=rare?'RARE BOSS CLEAR':'STAGE CLEAR';$('#rSub').innerHTML='撃破 '+run.kills+'体 / 戦利品 '+run.loot.length+'個 / 残りHP '+Math.max(0,run.hp);show('#result')}
function gameError(text){$('#rIco').textContent='⚠️';$('#rTitle').textContent='DATA ERROR';$('#rSub').textContent=text;show('#result')}
$('#back').onclick=()=>show('#stage');$('#enter').onclick=start;$('#roll').onclick=rollDice;$('#retry').onclick=()=>{if(selectedStage){pMission();show('#brief')}else show('#stage')};$('#home').onclick=()=>show('#stage');$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.t;render()});
loadCatalog();
</script>
</body>
