<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><title>LOOT MARKET</title><style>:root{--bg:#080b10;--p:#111720;--p2:#171f2b;--line:#293446;--text:#f4f7fa;--muted:#8f9bad;--a:#d8ff3e;--good:#79f2a7;--bad:#ff6f7d;--warn:#ffd166}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{font:inherit}body{min-height:100vh}.app{width:min(760px,100%);margin:auto;padding:16px 14px 80px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand{font-size:30px;font-weight:950;letter-spacing:-.05em}.k{font-size:10px;letter-spacing:.16em;color:var(--a);font-weight:900}.sub{font-size:12px;color:var(--muted);line-height:1.6}.badge{border:1px solid var(--line);border-radius:999px;padding:8px 10px;font-size:11px}.screen{display:none}.screen.on{display:block}.panel{background:var(--p);border:1px solid var(--line);border-radius:20px;padding:14px;margin:12px 0}.card{border:1px solid #39475e;border-radius:18px;background:linear-gradient(145deg,#17202c,#0e141d);padding:16px}.title{font-size:23px;font-weight:950;margin:4px 0}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:950;background:var(--a);color:#0a0d11;margin-top:12px}.btn2{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font-weight:900;background:var(--p2);color:var(--text);margin-top:8px}.mission{background:#0c1118;border:1px solid #38475d;border-radius:16px;padding:12px;margin-top:12px}.mission b{display:block;font-size:16px;margin-top:4px}.bar{height:9px;background:#252f3d;border-radius:999px;overflow:hidden;border:1px solid #344154}.fill{height:100%;width:100%;background:var(--good);transition:.18s}.mfill{background:var(--a);width:0}.battle{border:1px solid #334158;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 50% 30%,rgba(216,255,62,.08),transparent 25%),linear-gradient(#141c27,#080c12);min-height:520px}.hud{padding:13px}.hpLine{display:flex;justify-content:space-between;font-size:11px;font-weight:900;margin:0 0 5px}.enemy{height:245px;display:flex;flex-direction:column;align-items:center;justify-content:center}.sprite{font-size:88px;filter:drop-shadow(0 14px 15px #0008)}.ename{font-size:20px;font-weight:950;margin-top:10px}.etag{font-size:10px;color:var(--muted);margin-top:4px}.act{padding:0 13px 14px}.msg{min-height:54px;border:1px solid var(--line);border-radius:14px;background:#070a0fc7;padding:10px 12px;font-size:12px;line-height:1.55}.dice{width:100%;border:0;border-radius:16px;padding:15px;background:var(--a);color:#090d11;font-size:17px;font-weight:950;margin-top:10px}.run{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:8px}.loot{display:none;margin-top:12px}.loot.on{display:block}.item{border:1px solid var(--line);background:linear-gradient(#171f2a,#0f151e);border-radius:20px;overflow:hidden}.pic{height:175px;background:#0a0f15;display:grid;place-items:center;font-size:70px}.body{padding:13px}.rar{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 8px;font-size:10px;font-weight:950}.iname{font-size:21px;font-weight:950;margin:8px 0 4px}.desc{font-size:12px;color:var(--muted);line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.metric{background:#0b1118;border:1px solid var(--line);border-radius:12px;padding:9px;font-size:12px}.metric small{display:block;color:var(--muted);margin-bottom:4px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.action{border:1px solid var(--line);background:#0d131c;color:#dbe3ec;border-radius:12px;padding:10px;font-weight:850}.action.on{border-color:var(--a);color:var(--a)}.buy{display:block;text-align:center;text-decoration:none;margin-top:8px;border-radius:12px;padding:11px;background:#f1f4f7;color:#0b1016;font-weight:950}.buy.off{opacity:.4;pointer-events:none}.potion{text-align:center;border:1px solid #365d47;background:#101c16;border-radius:18px;padding:18px}.potion .ico{font-size:58px}.clear{text-align:center}.clear .ico{font-size:56px}.tabs{display:flex;gap:7px;overflow:auto;margin-top:18px}.tab{white-space:nowrap;border:1px solid var(--line);background:#0c121a;color:#bcc6d3;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:850}.tab.on{color:var(--a);border-color:var(--a)}.collection{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:9px}.mini{border:1px solid var(--line);background:var(--p);border-radius:14px;overflow:hidden}.miniPic{height:90px;background:#0b1118;display:grid;place-items:center;font-size:38px}.miniBody{padding:8px;font-size:11px;font-weight:850}.empty{border:1px dashed var(--line);border-radius:13px;padding:12px;color:var(--muted);font-size:12px}@media(min-width:680px){.collection{grid-template-columns:repeat(4,1fr)}.enemy{height:280px}}</style></head><body><div class="app"><div class="top"><div><div class="k">REAL PRODUCTS / DICE HACK & LOOT</div><div class="brand">LOOT MARKET</div><div class="sub">サイコロで倒す。実在商品を奪う。それだけ。</div></div><div class="badge" id="bookBadge">図鑑 0 / 20</div></div><section id="stage" class="screen on"><div class="panel"><div class="k">SELECT DUNGEON</div><div class="card"><div class="k">STAGE 01</div><div class="title">禁断の生活雑貨庫</div><div class="sub">日用品、便利グッズ、企画会議の正気を疑う品々が眠る。</div><button class="btn" id="select">このダンジョンへ</button></div></div></section><section id="brief" class="screen"><div class="panel"><div class="k">STAGE 01</div><div class="title">禁断の生活雑貨庫</div><div class="mission"><div class="k">BOSS APPEAR CONDITION</div><b id="briefMission"></b><div class="sub">条件達成までザコ敵が連続出現。</div></div><button class="btn" id="enter">ダンジョンに潜る</button><button class="btn2" id="back">戻る</button></div></section><section id="battle" class="screen"><div class="battle"><div class="hud"><div class="hpLine"><span>PLAYER HP</span><span id="phpT"></span></div><div class="bar"><div class="fill" id="phpB"></div></div><div class="mission"><div class="hpLine"><span class="k">BOSS CONDITION</span><span id="progT"></span></div><div class="bar"><div class="fill mfill" id="progB"></div></div><div class="sub" id="missionT"></div></div></div><div class="enemy"><div class="sprite" id="sprite"></div><div class="ename" id="ename"></div><div class="etag" id="etag"></div></div><div class="act"><div class="hpLine"><span id="ehpL">ENEMY HP</span><span id="ehpT"></span></div><div class="bar"><div class="fill" id="ehpB" style="background:var(--bad)"></div></div><div class="msg" id="msg">サイコロを振れ。</div><button class="dice" id="roll">🎲 サイコロを振る</button><div class="run"><span id="kills"></span><span id="loots"></span><span id="pots"></span></div></div></div><div class="loot" id="loot"></div></section><section id="result" class="screen"><div class="panel clear"><div class="ico" id="rIco"></div><div class="title" id="rTitle"></div><div class="sub" id="rSub"></div><button class="btn" id="retry">もう一度潜る</button><button class="btn2" id="home">ステージ選択へ</button></div></section><div class="tabs"><button class="tab on" data-t="d">発見図鑑</button><button class="tab" data-t="w">欲しい</button><button class="tab" data-t="o">持ってる</button></div><div class="collection" id="collection"></div></div><script>const S={maxHp:30,pHeal:7,pRate:.14,rbRate:.05,enemies:[['収納ミミック','📦',8,1,2],['暴走モップ','🧹',9,1,3],['逆襲の目覚まし','⏰',10,1,3],['無限ティッシュ','🧻',11,2,3],['家電ゴーレム','🧺',12,2,3]],boss:['在庫王 ザ・デッドストック','🗿',28,2,4],rboss:['返品不可神 カエセナイ','👁️',34,3,5],missions:[['weird','「意味不明 ★★★★★」を2種類発見せよ',2],['rare','RARE以上の商品を3種類発見せよ',3],['gift','「プレゼント力 ★★★★★」を2種類発見せよ',2],['kill','ザコ敵を5体撃破せよ',5],['uncommon','UNCOMMON以上の商品を4種類発見せよ',4]],items:[['p01','バナナ専用ケース','UNCOMMON','🍌',980,4,3,4],['p02','電動回転フォーク','RARE','🍝',2480,5,2,4],['p03','USBカップウォーマー','COMMON','☕',1680,2,4,3],['p04','指だけ出るミニ傘','EPIC','☂️',1180,5,1,5],['p05','猫の肉球マウスパッド','COMMON','🐾',1280,2,4,4],['p06','自動かき混ぜマグ','RARE','🥤',1980,4,3,4],['p07','鼻型メガネスタンド','RARE','👃',1580,5,3,5],['p08','寿司型USBメモリ','UNCOMMON','🍣',1480,4,4,4],['p09','ミニ卓上掃除機','COMMON','🧹',1780,2,5,3],['p10','頭皮マッサージ謎装置','EPIC','🧠',980,5,3,5],['p11','携帯バナナカッター','EPIC','🔪',780,5,1,5],['p12','光る靴ひも','UNCOMMON','👟',1380,4,2,4],['p13','机用ミニパンチングマシン','EPIC','🥊',2980,5,2,5],['p14','アヒル型ケーブルカバー','COMMON','🦆',680,3,4,4],['p15','巨大Enterキークッション','LEGENDARY','⌨️',3280,5,3,5],['p16','トースト型加湿器','RARE','🍞',2380,4,4,5],['p17','魚型スリッパ','EPIC','🐟',1880,5,3,5],['p18','デスク用ミニ冷蔵庫','RARE','🧊',3980,3,4,4],['p19','カニ型ペンホルダー','LEGENDARY','🦀',2180,5,3,5],['p20','雲型ティッシュケース','UNCOMMON','☁️',1980,3,4,4]]};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let mem={d:new Set(),w:new Set(),o:new Set()},tab='d',mission,run,enemy,ehp,isBoss=false,bossQ=false,locked=false;try{['d','w','o'].forEach(k=>mem[k]=new Set(JSON.parse(localStorage.getItem('loot-'+k)||'[]')))}catch(e){}function save(){try{['d','w','o'].forEach(k=>localStorage.setItem('loot-'+k,JSON.stringify([...mem[k]])))}catch(e){}}function show(id){$$('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');scrollTo(0,0)}function pick(a){return a[Math.floor(Math.random()*a.length)]}function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}function item(id){return S.items.find(x=>x[0]===id)}function rank(r){return{COMMON:0,UNCOMMON:1,RARE:2,EPIC:3,LEGENDARY:4}[r]}function stars(n){return'★'.repeat(n)+'☆'.repeat(5-n)}function render(){bookBadge.textContent='図鑑 '+mem.d.size+' / '+S.items.length;let arr=[...mem[tab]].map(item).filter(Boolean);collection.innerHTML=arr.length?arr.map(x=>`<div class="mini"><div class="miniPic">${x[3]}</div><div class="miniBody">${x[1]}<div class="sub">${x[2]} / 意味不明★${x[5]}</div></div></div>`).join(''):'<div class="empty">まだ何もない。</div>'}function pMission(){mission=pick(S.missions);briefMission.textContent=mission[1]}function start(){run={hp:S.maxHp,kills:0,loot:[],pots:0,rare:false};bossQ=false;isBoss=false;locked=false;loot.className='loot';show('#battle');spawn()}function spawn(){isBoss=bossQ;if(isBoss){run.rare=Math.random()<S.rbRate;enemy=run.rare?S.rboss:S.boss}else enemy=pick(S.enemies);ehp=enemy[2];sprite.textContent=enemy[1];ename.textContent=enemy[0];etag.textContent=isBoss?(run.rare?'RARE BOSS':'BOSS'):'ZAKO';ehpL.textContent=isBoss?'BOSS HP':'ENEMY HP';msg.textContent=enemy[0]+' が現れた。サイコロを振れ。';locked=false;roll.disabled=false;ui()}function progress(){let u=[...new Set(run.loot)].map(item);if(mission[0]=='weird')return u.filter(x=>x[5]==5).length;if(mission[0]=='rare')return u.filter(x=>rank(x[2])>=2).length;if(mission[0]=='gift')return u.filter(x=>x[7]==5).length;if(mission[0]=='kill')return run.kills;if(mission[0]=='uncommon')return u.filter(x=>rank(x[2])>=1).length;return 0}function ui(){phpT.textContent=Math.max(0,run.hp)+' / '+S.maxHp;phpB.style.width=Math.max(0,run.hp)/S.maxHp*100+'%';ehpT.textContent=Math.max(0,ehp)+' / '+enemy[2];ehpB.style.width=Math.max(0,ehp)/enemy[2]*100+'%';let p=Math.min(mission[2],progress());progT.textContent=p+' / '+mission[2];progB.style.width=p/mission[2]*100+'%';missionT.textContent=mission[1];kills.textContent='撃破 '+run.kills;loots.textContent='戦利品 '+run.loot.length;pots.textContent='ポーション '+run.pots}function rollDice(){if(locked||run.hp<=0||ehp<=0)return;locked=true;roll.disabled=true;let n=ri(1,6);ehp-=n;if(ehp<=0){msg.textContent='🎲 '+n+'！ '+enemy[0]+' を撃破！';ui();setTimeout(win,180);return}let d=ri(enemy[3],enemy[4]);run.hp-=d;msg.textContent='🎲 '+n+'！ '+n+'ダメージ。反撃で '+d+'ダメージ。';ui();if(run.hp<=0)setTimeout(gameOver,180);else{locked=false;roll.disabled=false}}function dropItem(minRank=-1){let pool=S.items.filter(x=>rank(x[2])>=minRank&&!run.loot.includes(x[0]));if(!pool.length)pool=S.items.filter(x=>rank(x[2])>=minRank);return pick(pool)}function win(){if(isBoss){showLoot(dropItem(2),true);return}run.kills++;if(Math.random()<S.pRate){run.pots++;let before=run.hp;run.hp=Math.min(S.maxHp,run.hp+S.pHeal);showPotion(run.hp-before)}else showLoot(dropItem(),false);ui()}function showPotion(h){loot.innerHTML=`<div class="potion"><div class="ico">🧪</div><div class="title">回復ポーション</div><div class="sub">HPを ${h} 回復した。</div><button class="btn2" id="next">次へ</button></div>`;loot.className='loot on';next.onclick=cont}function showLoot(x,boss){run.loot.push(x[0]);mem.d.add(x[0]);save();render();loot.innerHTML=`<div class="item"><div class="pic">${x[3]}</div><div class="body"><span class="rar">${x[2]}${boss?' ・ BOSS LOOT':''}</span><div class="iname">${x[1]}</div><div class="desc">実在商品デモ。正式版ではここに商品画像と説明が入る。</div><div class="grid"><div class="metric"><small>意味不明</small>${stars(x[5])}</div><div class="metric"><small>実用性</small>${stars(x[6])}</div><div class="metric"><small>プレゼント力</small>${stars(x[7])}</div><div class="metric"><small>参考価格</small>¥${x[4].toLocaleString()}</div></div><div class="actions"><button class="action ${mem.w.has(x[0])?'on':''}" id="wish">♡ 欲しい</button><button class="action ${mem.o.has(x[0])?'on':''}" id="own">✓ 持ってる</button></div><a class="buy off">商品リンク未設定</a><button class="btn2" id="next">${boss?'クリア結果へ':'次へ'}</button></div></div>`;loot.className='loot on';wish.onclick=()=>tog('w',x[0],wish);own.onclick=()=>tog('o',x[0],own);next.onclick=boss?clearStage:cont}function tog(k,id,el){mem[k].has(id)?mem[k].delete(id):mem[k].add(id);el.classList.toggle('on',mem[k].has(id));save();render()}function cont(){loot.className='loot';loot.innerHTML='';if(progress()>=mission[2])bossQ=true;spawn()}function gameOver(){rIco.textContent='💀';rTitle.textContent='GAME OVER';rSub.innerHTML='撃破 '+run.kills+'体 / 戦利品 '+run.loot.length+'個。<br>発見商品は図鑑に残ります。';show('#result')}function clearStage(){rIco.textContent=run.rare?'👁️':'🏆';rTitle.textContent=run.rare?'RARE BOSS CLEAR':'STAGE CLEAR';rSub.innerHTML='撃破 '+run.kills+'体 / 戦利品 '+run.loot.length+'個 / 残りHP '+Math.max(0,run.hp);show('#result')}select.onclick=()=>{pMission();show('#brief')};back.onclick=()=>show('#stage');enter.onclick=start;roll.onclick=rollDice;retry.onclick=()=>{pMission();show('#brief')};home.onclick=()=>show('#stage');$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');tab=b.dataset.t;render()});render();</script></body></html>
