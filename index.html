<script>
const S={maxHp:30,pHeal:7,pRate:.14,rbRate:.05,enemies:[['収納ミミック','📦',8,1,2],['暴走モップ','🧹',9,1,3],['逆襲の目覚まし','⏰',10,1,3],['無限ティッシュ','🧻',11,2,3],['家電ゴーレム','🧺',12,2,3]],boss:['在庫王 ザ・デッドストック','🗿',28,2,4],rboss:['返品不可神 カエセナイ','👁️',34,3,5],missions:[['weird','「意味不明 ★★★★★」を2種類発見せよ',2],['rare','RARE以上の商品を3種類発見せよ',3],['gift','「プレゼント力 ★★★★★」を2種類発見せよ',2],['kill','ザコ敵を5体撃破せよ',5],['uncommon','UNCOMMON以上の商品を4種類発見せよ',4]],items:[['p01','バナナ専用ケース','UNCOMMON','🍌',980,4,3,4],['p02','電動回転フォーク','RARE','🍝',2480,5,2,4],['p03','USBカップウォーマー','COMMON','☕',1680,2,4,3],['p04','指だけ出るミニ傘','EPIC','☂️',1180,5,1,5],['p05','猫の肉球マウスパッド','COMMON','🐾',1280,2,4,4],['p06','自動かき混ぜマグ','RARE','🥤',1980,4,3,4],['p07','鼻型メガネスタンド','RARE','👃',1580,5,3,5],['p08','寿司型USBメモリ','UNCOMMON','🍣',1480,4,4,4],['p09','ミニ卓上掃除機','COMMON','🧹',1780,2,5,3],['p10','頭皮マッサージ謎装置','EPIC','🧠',980,5,3,5],['p11','携帯バナナカッター','EPIC','🔪',780,5,1,5],['p12','光る靴ひも','UNCOMMON','👟',1380,4,2,4],['p13','机用ミニパンチングマシン','EPIC','🥊',2980,5,2,5],['p14','アヒル型ケーブルカバー','COMMON','🦆',680,3,4,4],['p15','巨大Enterキークッション','LEGENDARY','⌨️',3280,5,3,5],['p16','トースト型加湿器','RARE','🍞',2380,4,4,5],['p17','魚型スリッパ','EPIC','🐟',1880,5,3,5],['p18','デスク用ミニ冷蔵庫','RARE','🧊',3980,3,4,4],['p19','カニ型ペンホルダー','LEGENDARY','🦀',2180,5,3,5],['p20','雲型ティッシュケース','UNCOMMON','☁️',1980,3,4,4]]};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let mem={d:new Set(),w:new Set(),o:new Set()},tab='d',mission,run,enemy,ehp,isBoss=false,bossQ=false,locked=false;try{['d','w','o'].forEach(k=>mem[k]=new Set(JSON.parse(localStorage.getItem('loot-'+k)||'[]')))}catch(e){}function save(){try{['d','w','o'].forEach(k=>localStorage.setItem('loot-'+k,JSON.stringify([...mem[k]])))}catch(e){}}function show(id){$$('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');collectionArea.classList.toggle('hide',id==='#battle');scrollTo(0,0)}function setArena(id){['enemyState','defeatState','lootState','potionState','warningState'].forEach(x=>$('#'+x).classList.toggle('on',x===id))}function pick(a){return a[Math.floor(Math.random()*a.length)]}function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}function item(id){return S.items.find(x=>x[0]===id)}function rank(r){return{COMMON:0,UNCOMMON:1,RARE:2,EPIC:3,LEGENDARY:4}[r]}function stars(n){return'★'.repeat(n)+'☆'.repeat(5-n)}function render(){bookBadge.textContent='図鑑 '+mem.d.size+' / '+S.items.length;let arr=[...mem[tab]].map(item).filter(Boolean);collection.innerHTML=arr.length?arr.map(x=>`<div class="mini"><div class="miniPic">${x[3]}</div><div class="miniBody">${x[1]}<div class="sub">${x[2]} / 意味不明★${x[5]}</div></div></div>`).join(''):'<div class="empty">まだ何もない。</div>'}function pMission(){mission=pick(S.missions);briefMission.textContent=mission[1]}function start(){run={hp:S.maxHp,kills:0,loot:[],pots:0,rare:false};bossQ=false;isBoss=false;show('#battle');spawn()}function spawn(){isBoss=bossQ;enemy=isBoss?(run.rare?S.rboss:S.boss):pick(S.enemies);ehp=enemy[2];sprite.textContent=enemy[1];ename.textContent=enemy[0];etag.textContent=isBoss?(run.rare?'RARE BOSS':'BOSS'):'ZAKO';ehpL.textContent=isBoss?'BOSS HP':'ENEMY HP';msg.textContent=isBoss?'ボスが出現した。決戦だ。':enemy[0]+' が現れた。サイコロを振れ。';setArena('enemyState');enemyState.className='state enemyState on enemyIn';setTimeout(()=>enemyState.className='state enemyState on',240);locked=false;roll.disabled=false;ui()}function progress(){let u=[...new Set(run.loot)].map(item);if(mission[0]=='weird')return u.filter(x=>x[5]==5).length;if(mission[0]=='rare')return u.filter(x=>rank(x[2])>=2).length;if(mission[0]=='gift')return u.filter(x=>x[7]==5).length;if(mission[0]=='kill')return run.kills;if(mission[0]=='uncommon')return u.filter(x=>rank(x[2])>=1).length;return 0}function ui(){phpT.textContent=Math.max(0,run.hp)+' / '+S.maxHp;phpB.style.width=Math.max(0,run.hp)/S.maxHp*100+'%';ehpT.textContent=Math.max(0,ehp)+' / '+enemy[2];ehpB.style.width=Math.max(0,ehp)/enemy[2]*100+'%';let p=Math.min(mission[2],progress());progT.textContent=p+' / '+mission[2];progB.style.width=p/mission[2]*100+'%';missionT.textContent=mission[1];kills.textContent='撃破 '+run.kills;loots.textContent='戦利品 '+run.loot.length;pots.textContent='ポーション '+run.pots}function rollDice(){if(locked||run.hp<=0||ehp<=0)return;locked=true;roll.disabled=true;let n=ri(1,6);ehp-=n;enemyState.className='state enemyState on enemyHit';setTimeout(()=>enemyState.className='state enemyState on',170);if(ehp<=0){msg.textContent='🎲 '+n+'！ '+enemy[0]+' を撃破！';ui();setTimeout(showDefeat,180);return}let d=ri(enemy[3],enemy[4]);run.hp-=d;msg.textContent='🎲 '+n+'！ '+n+'ダメージ。反撃で '+d+'ダメージ。';ui();if(run.hp<=0)setTimeout(gameOver,180);else{locked=false;roll.disabled=false}}function showDefeat(){defeatSub.textContent=isBoss?'ボスを撃破した':'敵を撃破した';setArena('defeatState');setTimeout(win,520)}function dropItem(min=-1){let pool=S.items.filter(x=>rank(x[2])>=min&&!run.loot.includes(x[0]));if(!pool.length)pool=S.items.filter(x=>rank(x[2])>=min);return pick(pool)}function win(){if(isBoss){showLoot(dropItem(2),true);return}run.kills++;if(Math.random()<S.pRate){run.pots++;let b=run.hp;run.hp=Math.min(S.maxHp,run.hp+S.pHeal);showPotion(run.hp-b)}else showLoot(dropItem(),false);ui()}function showPotion(h){potionState.innerHTML=`<div class="potionIcon">🧪</div><div class="potionTitle">回復ポーション</div><div class="potionText">HPを ${h} 回復した。</div><button class="btn2" id="nextPotion">次へ</button>`;setArena('potionState');nextPotion.onclick=cont;msg.textContent='ポーションを入手。'}function showLoot(x,boss){run.loot.push(x[0]);mem.d.add(x[0]);save();render();lootState.innerHTML=`<div class="lootCard"><div class="lootTop"><div class="lootIcon">${x[3]}</div><div class="lootInfo"><span class="rar">${x[2]}${boss?' ・ BOSS LOOT':''}</span><div class="iname">${x[1]}</div><div class="lootDesc">実在商品デモ。正式版では商品画像と説明を表示。</div></div></div><div class="metrics"><div class="metric"><small>意味不明</small><strong>${stars(x[5])}</strong></div><div class="metric"><small>実用性</small><strong>${stars(x[6])}</strong></div><div class="metric"><small>プレゼント力</small><strong>${stars(x[7])}</strong></div></div><div class="lootActions"><button class="action ${mem.w.has(x[0])?'on':''}" id="wish">♡ 欲しい</button><button class="action ${mem.o.has(x[0])?'on':''}" id="own">✓ 持ってる</button></div><button class="btn2" id="nextLoot">${boss?'クリア結果へ':'次へ'}</button></div>`;setArena('lootState');wish.onclick=()=>tog('w',x[0],wish);own.onclick=()=>tog('o',x[0],own);nextLoot.onclick=boss?clearStage:cont;msg.textContent='戦利品を獲得。'}function showWarning(){roll.disabled=true;locked=true;let rare=run.rare;warningState.innerHTML=rare?`<div class="warningPanel rare"><div class="warningMini">UNIDENTIFIED HOSTILE SIGNAL</div><div class="warningWord">DANGER</div><div class="rareSig">UNKNOWN SIGNAL DETECTED</div><div class="warningBody">通常個体とは異なる反応を検知。<br>識別不能な敵性存在が接近しています。</div><div class="warningBoss">RARE BOSS 出現</div><button class="warningBtn" id="warningGo">接触する</button></div>`:`<div class="warningPanel"><div class="warningMini">BOSS ALERT</div><div class="warningWord">WARNING</div><div class="warningBody">ダンジョン内の異常反応を検知。<br>強力な敵性在庫が接近しています。</div><div class="warningBoss">BOSS 出現</div><button class="warningBtn" id="warningGo">ボス戦へ</button></div>`;setArena('warningState');msg.textContent=rare?'識別不能な反応。何かがおかしい。':'警告。ボスが出現する。';warningGo.onclick=spawn}function tog(k,id,el){mem[k].has(id)?mem[k].delete(id):mem[k].add(id);el.classList.toggle('on',mem[k].has(id));save();render()}function cont(){if(progress()>=mission[2]&&!bossQ){bossQ=true;run.rare=Math.random()<S.rbRate;showWarning();return}spawn()}function gameOver(){rIco.textContent='💀';rTitle.textContent='GAME OVER';rSub.innerHTML='撃破 '+run.kills+'体 / 戦利品 '+run.loot.length+'個。<br>発見商品は図鑑に残ります。';show('#result')}function clearStage(){rIco.textContent=run.rare?'👁️':'🏆';rTitle.textContent=run.rare?'RARE BOSS CLEAR':'STAGE CLEAR';rSub.innerHTML='撃破 '+run.kills+'体 / 戦利品 '+run.loot.length+'個 / 残りHP '+Math.max(0,run.hp);show('#result')}select.onclick=()=>{pMission();show('#brief')};bac
