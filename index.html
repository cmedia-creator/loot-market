<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>LOOT MARKET</title>
<link rel="stylesheet" href="./game.css?v=20260831-01">
<link rel="stylesheet" href="./boss-skills.css?v=20260831-02">
<link rel="stylesheet" href="./affiliate-ui.css?v=20260831-03">
<link rel="stylesheet" href="./account-ui.css?v=20260831-02">
<link rel="stylesheet" href="./dice-system.css?v=20260831-01">
<link rel="stylesheet" href="./rarity-system.css?v=20260831-01">
<link rel="stylesheet" href="./dice-ui-fix.css?v=20260831-01">
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="k">REAL PRODUCTS / DICE HACK & LOOT</div><div class="brand">LOOT MARKET</div><div class="sub">サイコロで倒す。実在商品を奪う。それだけ。</div></div>
    <div class="badge" id="bookBadge">図鑑 - / -</div>
  </div>

  <section id="stage" class="screen on">
    <div class="panel"><div class="k">SELECT DUNGEON</div><div id="stageList" class="stageGrid"><div class="loading">ダンジョンデータを読み込み中…</div></div></div>
  </section>

  <section id="brief" class="screen">
    <div class="panel"><div class="k" id="briefStageNo">STAGE</div><div class="title" id="briefTitle"></div><div class="sub" id="briefDesc"></div><div class="mission" style="margin-top:12px"><div class="k">BOSS APPEAR CONDITION</div><b id="briefMission"></b><div class="sub">条件達成までザコ敵が連続出現。</div></div><button class="btn" id="enter">ダンジョンに潜る</button><button class="btn2" id="back">戻る</button></div>
  </section>

  <section id="battle" class="screen">
    <div class="battleShell" id="battleShell">
      <div class="battleHud">
        <div class="hpLine"><span>PLAYER HP</span><span id="phpT"></span></div><div class="bar"><div class="fill" id="phpB"></div></div>
        <div class="battleMission mission"><div class="hpLine"><span class="k">BOSS CONDITION</span><span id="progT"></span></div><div class="bar"><div class="fill mfill" id="progB"></div></div><div class="sub" id="missionT"></div></div>
        <div class="comboHud"><div class="historyBox"><div class="historyLabel">DICE HISTORY / COMBO WATCH</div><div class="historyDice" id="diceHistory"></div></div><div class="powerBox hide" id="powerStatus"></div></div>
      </div>
      <div class="arena">
        <div id="enemyState" class="state enemyState on"><div class="sprite" id="sprite"></div><div class="ename" id="ename"></div><div class="etag" id="etag"></div><div class="enemyHpWrap"><div class="hpLine"><span id="ehpL">ENEMY HP</span><span id="ehpT"></span></div><div class="bar"><div class="fill" id="ehpB" style="background:var(--bad)"></div></div></div></div>
        <div id="diceState" class="state diceState"></div>
        <div id="skillState" class="state skillState"></div>
        <div id="defeatState" class="state defeatState"><div class="defeatWord">DEFEATED</div><div class="defeatSub" id="defeatSub"></div></div>
        <div id="lootState" class="state lootState"></div>
        <div id="potionState" class="state potionState"></div>
        <div id="warningState" class="state warningState"></div>
      </div>
      <div class="actionZone"><div class="msg" id="msg">サイコロを振れ。</div><button class="dice" id="roll">🎲 サイコロを振る</button><div class="run"><span id="kills"></span><span id="loots"></span><span id="pots"></span></div></div>
    </div>
  </section>

  <section id="result" class="screen"><div class="panel clear"><div class="ico" id="rIco"></div><div class="title" id="rTitle"></div><div class="sub" id="rSub"></div><button class="btn" id="retry">もう一度潜る</button><button class="btn2" id="home">ステージ選択へ</button></div></section>

  <div id="collectionArea"><div class="tabs"><button class="tab on" data-t="d">発見図鑑</button><button class="tab" data-t="w">欲しい</button><button class="tab" data-t="o">持ってる</button><button class="tab" data-t="s">あとで見る</button></div><div class="collection" id="collection"></div></div>
</div>
<script src="./game.js?v=20260831-01"></script>
<script src="./boss-skills.js?v=20260831-02"></script>
<script src="./affiliate-ui.js?v=20260831-03"></script>
<script src="./account-ui.js?v=20260831-01"></script>
<script src="./dice-system.js?v=20260831-01"></script>
<script src="./rarity-system.js?v=20260831-01"></script>
<script src="./dice-ui-fix.js?v=20260831-01"></script>
</body>
</html>
